default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: diaphniecasimir
  password: # (leave blank or use env var if needed)

development:
  <<: *default
  database: bonid_development

test:
  <<: *default
  database: bonid_test

production:
  primary: &primary_production
    <<: *default
    database: bonid_production
    username: bonid
    password: <%= ENV["BONID_DATABASE_PASSWORD"] %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: bonid_production_cache
    migrations_paths: db/cache_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |u| u.path = "#{u.path.presence || "/postgres"}_cache" } if ENV["DATABASE_URL"] %>
  queue:
    <<: *primary_production
    database: bonid_production_queue
    migrations_paths: db/queue_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |u| u.path = "#{u.path.presence || "/postgres"}_queue" } if ENV["DATABASE_URL"] %>
  cable:
    <<: *primary_production
    database: bonid_production_cable
    migrations_paths: db/cable_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |u| u.path = "#{u.path.presence || "/postgres"}_cable" } if ENV["DATABASE_URL"] %>
