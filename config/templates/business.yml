config/templates/business.yml
# ================================================================
# BonID — Business Verification Record Template
# ---------------------------------------------------------------
# Used by Citizens::VerificationRecordsController#default_template_for(:business)
# Provides a clean JSON structure for new records
# ensuring no raw {} or uninitialized keys appear in forms.
# ================================================================

business_name: ""
trade_name: ""
registration_number: ""
registration_authority: ""       # e.g. "MICT", "DGI", "MCI"
business_type: ""                # e.g. "Food Delivery Platform"
legal_structure: ""              # e.g. "SARL", "SA"
nif: ""                          # Haitian Fiscal ID (Numéro d’Identification Fiscale)
cnss_employer_number: ""         # Employer number from CNSS
tax_status: ""                   # "Active", "Inactive", "Suspended", "Exempt"
vat_registered: false

business_address: ""             # Full postal or street address
sector: ""                       # From PartnerSectorConstants::SECTORS
subsector: ""                    # Optional subcategory for finer classification
employees_count: 0
annual_revenue_htg: 0
employees_count: 0
average_monthly_salary_htg: 0      # NEW — average payroll per employee
annual_revenue_htg: 0


license_expiration_date: ""      # e.g. "2026-12-31"
incorporation_date: ""           # e.g. "2023-06-14"

verified_by_partner: ""          # e.g. "Unibank" or "MICT"
verification_date: ""            # e.g. "2025-10-09"
risk_rating: ""                  # "Low", "Medium", "High"
compliance_status: ""            # "Verified", "Pending", "Flagged"
compliance_notes: ""             # Freeform text for partner or officer review

owner_name: ""
owner_bonid: ""                  # Citizen BonID of the representative
contact_email: ""
contact_phone: ""
website: ""

iban_or_bank_account: ""         # Optional for financial onboarding
geo_coordinates:
  lat: ""
  lng: ""

# === Attachments (ActiveStorage placeholders)
# These are uploaded dynamically through the form
attachments:
  dgi_certificate: null
  mict_license: null
  cnss_certificate: null
  proof_of_address: null
  owner_id_card: null
  tax_clearance: null
