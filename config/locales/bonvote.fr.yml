    basic_db_desc: "Elles stockent simplement les votes dans un tableau. Les administrateurs peuvent modifier les donnees. Pas de preuve publique."
    verifiable_title: "BonVote: registre verifiable"
    verifiable_desc: "La norme la plus elevee pour l'integrite electorale. Chaque vote a une preuve cryptographique. N'importe qui peut auditer les mathematiques."
    estonia_note: "Les modeles internationaux comme le i-Voting d'Estonie montrent que ce systeme est possible. Haiti a des defis d'infrastructure uniques, mais BonVote est optimise pour les reseaux mobiles locaux."

    faq_title: "Questions Frequemment Posees"
    faq1_q: "Mon vote est-il secret?"
    faq1_a: "Oui, completement. Le Pedersen Commitment cache votre choix. Meme le serveur BonVote ne peut pas voir ce que vous avez vote. Quand le decompte est termine, seul le total est revele, pas les votes individuels."
    faq2_q: "Quelqu'un peut-il voter deux fois?"
    faq2_a: "Impossible. Le systeme 'nullifier' ZKP detecte les doubles votes en 1,74ms. Chaque citoyen a un seul nullifier unique qui ne peut pas etre utilise deux fois. Les mathematiques l'empechent, pas les humains."
    faq3_q: "Et si je perds mon telephone?"
    faq3_a: "Votre vote est deja scelle dans le registre, pas sur votre telephone. Vous pouvez le verifier avec votre numero de recu sur n'importe quel appareil. Si vous n'avez pas encore vote, vous pouvez revoquer l'acces avec BonID et re-verifier sur un nouvel appareil."
    faq4_q: "BonVote est-il une solution magique?"
    faq4_a: "Non. Les experts suggerent qu'une transition complete peut prendre jusqu'a 10 ans. Cela necessite la confiance du public, l'education et l'infrastructure. Mais chaque election avec BonVote est un pas de plus."
    faq5_q: "Et les pertes d'emploi?"
    faq5_a: "Le vote manuel fournit environ 50 000 emplois temporaires. BonVote les remplace par moins de roles mais plus qualifies et mieux payes: techniciens IT, support citoyen, auditeurs cryptographiques."
    faq6_q: "Qui peut verifier les resultats?"
    faq6_a: "Tout le monde. Le registre public est ouvert aux observateurs internationaux (OEA, ONU), aux medias, aux partis politiques et a tous les citoyens. Les mathematiques sont publiques, il n'y a pas de secrets dans le decompte."

