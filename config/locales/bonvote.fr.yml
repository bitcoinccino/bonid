    # Results page - How It Works
    results_how_title: "Comment Ca Fonctionne"
    results_how_sub: "Du jour du vote a la proclamation de l'elu — chaque etape verifiee, chiffree et transparente."
    results_step1_title: "1. Inscription avec l'ONI"
    results_step1_desc: "Les citoyens s'inscrivent sur la Liste Electorale de l'ONI. BonID verifie votre identite avec la biometrie (reconnaissance faciale + vivacite) pour confirmer que vous etes bien qui vous pretendez etre. Chaque electeur recoit un BonID unique."
    results_step2_title: "2. Jour d'Election — Voter"
    results_step2_desc_html: "Sur votre telephone ou dans un bureau de vote (kiosque), vous verifiez votre identite avec un controle de vivacite. Vous choisissez votre candidat et soumettez votre vote. Le vote est chiffre avec <strong style='color:#EDB95E;'>AES-256-GCM</strong> + <strong style='color:#EDB95E;'>Pedersen Commitment</strong> — meme BonID ne peut pas voir pour qui vous avez vote."
    results_step3_title: "3. Recu Cryptographique"
    results_step3_desc_html: "Vous recevez un <strong style='color:#10B981;'>Merkle Path</strong> — preuve mathematique que votre vote a ete enregistre dans le systeme sans reveler pour qui vous avez vote. Vous pouvez le verifier a tout moment sur le <a href='/election/verify' style='color: #2563EB; text-decoration: none; font-weight: 600;'>registre public</a>."
    results_step4_title: "4. Urne Scellee"
    results_step4_desc: "Quand le vote se termine, l'urne est scellee avec une cryptographie de niveau militaire. Personne ne peut voir les resultats — ni BonID, ni le gouvernement, ni aucun technicien. Les resultats restent chiffres jusqu'a la ceremonie de dechiffrement."
    results_step5_title: "5. Ceremonie Multi-Sig (5 sur 9)"
    results_step5_desc_html: "Pour ouvrir l'urne, <strong style='color:#fff;'>5 des 9</strong> officiels independants (observateurs nationaux, internationaux, CEP, societe civile, technologie) doivent chacun verifier leur identite avec BonID et entrer leur cle privee. Aucune personne seule ne peut deverrouiller les resultats."
    results_step6_title: "6. Resultats En Direct"
    results_step6_desc: "Une fois les 5 signatures verifiees, les resultats sont dechiffres et apparaissent en direct sur cette page. Les resultats provisoires s'affichent en temps reel — chaque vote compte apparait instantanement. Tout le monde voit les memes resultats en meme temps — pas d'acces special, pas de canaux secrets."
    results_step7_title: "7. Certification & Elu Proclame"
    results_step7_desc_html: "Quand la periode de contestation se termine, le CEP certifie les resultats finaux. Le candidat gagnant est officiellement proclame. Le hash cryptographique final est enregistre de facon permanente — preuve qui ne peut etre modifiee, effacee ou falsifiee. N'importe qui peut verifier l'authenticite des resultats via l'<a href='/election/verify' style='color: #2563EB; text-decoration: none; font-weight: 600;'>audit public BonVote <i class='ri-external-link-line' style='font-size: 0.6rem;'></i></a>."
    results_summary_html: "<strong style='color: #fff;'>Chaque etape est auditable, verifiee et transparente.</strong><br>Pas d'urnes perdues. Pas de bulletins disparus. Pas de resultats fabriques.<br>Chaque vote compte — et vous pouvez le prouver."
    results_view: "Voir les Resultats Officiels"

