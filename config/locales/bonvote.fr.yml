  bonvote:
    title: "BonVote · Verifiez Votre Vote | BonID"
    hero_title: "Registre Public Electoral"
    hero_sub: "Le premier systeme de vote numerique securise et transparent pour Haiti. Chaque vote verifie, chaque voix compte."

    tab_security: "Securite"
    tab_how: "Comment"
