    security_title: "Securite: Technologie Inviolable"
    security_intro: "BonVote utilise le meme type de cryptographie que les banques et les gouvernements. Voici comment chaque couche protege votre vote."
    pedersen_title: "Pedersen Commitments"
    pedersen_desc: "Cache votre choix tout en s'y engageant. Meme les administrateurs du systeme ne peuvent pas voir votre vote jusqu'a la fin du decompte. C'est comme mettre votre vote dans un coffre qui ne peut pas s'ouvrir tant que tout le monde n'a pas vote."
    schnorr_title: "Schnorr ZKP (Preuves a Connaissance Nulle)"
    schnorr_desc: "Prouve que vous etes eligible pour voter et que votre bulletin est valide (par exemple, vous n'avez pas vote pour 10 candidats) sans reveler pour qui vous avez vote. Les mathematiques le prouvent, pas les humains."
    aes_title: "AES-256-GCM (Chiffrement Authentifie)"
    aes_desc: "Garantit que les donnees du bulletin voyageant de votre telephone au serveur a Port-au-Prince ne peuvent pas etre interceptees ou modifiees. Meme niveau de securite que les banques internationales."
    biometric_title: "Verification Biometrique Double"
    biometric_desc: "Empreinte digitale + numero CIN (Carte d'Identification Nationale). Citoyens et diaspora utilisent BonID pour la verification. Deux couches de securite empechent toute fraude."
    fraud_title: "Prevention de la Fraude"
    fraud_desc: "Elimine les irregularites de 'liste de carence' (vote par representant de parti), la vente de passes de vote, et le bourrage d'urnes. Le systeme numerique rend tout cela impossible."

    how_title: "Le Parcours de l'Electeur"
    step1_title: "Inscription avec l'ONI"
    step1_desc: "Utilisez votre Carte d'Identification Nationale (CIN) qui contient deja des biometriques (scan oculaire, empreinte digitale). BonID est construit sur l'infrastructure et la technologie existantes de l'ONI (Office National d'Identification), il ne le remplace pas."
    step2_title: "Verifier l'Identite avec BonID"
    step2_desc: "Connectez-vous et verifiez votre identite via BonID avec detection de vivacite (liveness), un selfie en direct, et comparaison de documents avec votre CIN ou Passeport. BonID croise votre visage et vos documents avec la base de donnees biometrique existante de l'ONI pour confirmer que vous etes un vrai citoyen. Citoyens locaux et diaspora utilisent le meme systeme."
    step3_title: "Voter en Securite"
    step3_desc: "Choisissez votre candidat. Votre vote est chiffre immediatement avec Pedersen Commitment. Personne ne peut voir ce que vous avez vote, meme le serveur."
    step4_title: "Recevoir le Recu (Merkle Path)"
    step4_desc: "Recevez un numero de recu unique. C'est votre chemin Merkle, qui vous permet de prouver que votre vote a ete reellement inclus dans le decompte final. C'est la 'Boite a Bulletins Numerique'."
    step5_title: "Verifier dans le Registre Public"
    step5_desc: "Collez votre numero de recu dans la recherche a droite pour confirmer que votre vote est enregistre. Chaque vote est une feuille dans l'arbre Merkle."
    step6_title: "Resultats Instantanes"
    step6_desc: "Les votes vont au serveur national via internet/intranet. Resultats preliminaires en quelques minutes au lieu de semaines de decompte manuel."

    what_title: "Qu'est-ce que BonVote?"
    mission_title: "Mission"
    mission_desc: "Une plateforme de vote decentralisee et transparente pour Haiti. S'eloigner des bulletins papier sujets au bourrage d'urnes et aller vers une democratie mathematiquement verifiable."
    platform_title: "Plateforme Mobile"
    platform_desc: "Concu pour Android et iOS pour s'adapter a la plupart des telephones en Haiti. Optimise pour les reseaux 3G/4G avec des preuves ZKP suffisamment petites pour etre envoyees sur un signal faible."
    diaspora_title: "Pour la Diaspora et les Citoyens Locaux"
    diaspora_desc: "Des millions d'Haitiens vivant a l'etranger n'ont actuellement aucune option de vote a distance. BonVote leur donne une voix dans la democratie de leur pays."
    ledger_title: "Registre Verifiable"
    ledger_desc: "Pas une simple base de donnees. C'est un registre verifiable (verifiable ledger), la norme la plus elevee pour l'integrite electorale. Tout citoyen ou observateur peut verifier les mathematiques de l'election."

    advantages_title: "Avantages de BonVote"
    transparency_title: "Transparence Totale"
    transparency_desc: "Grace a l'arbre Merkle, tout citoyen ou observateur international peut verifier les mathematiques de l'election sans violer le secret du vote. OEA, ONU, medias, tout le monde peut auditer."
    inclusion_title: "Inclusion de la Diaspora"
    inclusion_desc: "Permet a des millions d'Haitiens vivant a l'etranger de participer en toute securite aux elections de leur pays."
    savings_title: "Economiser 18 Millions $"
    savings_desc: "Elimine l'impression des bulletins et leur transport a travers le terrain difficile du pays, ainsi que les centres de decompte manuel."
    participation_title: "Augmenter la Participation"
    participation_desc: "La participation en 2016 n'etait que de 19%. Un acces plus facile peut l'augmenter significativement grace au vote mobile."
    aid_title: "Reduire la Dependance a l'Aide Etrangere"
    aid_desc: "Des couts electoraux plus bas reduisent la dependance d'Haiti au financement international pour ses processus democratiques."

    performance_title: "Performance et Echelle"
    performance_intro: "500K votes en 12 heures = 11,5 votes/seconde en moyenne. Le systeme peut gerer plus de 1 000 par seconde sans effort."
