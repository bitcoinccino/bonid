    confirmations:
      confirmed: "Votre compte a été confirmé avec succès."
      send_instructions: "Vous recevrez un courriel avec des instructions sur la manière de confirmer votre compte dans quelques minutes."
      send_paranoid_instructions: "Si votre adresse courriel existe dans notre base de données, vous recevrez un courriel avec des instructions sur la manière de confirmer votre compte dans quelques minutes."
    failure:
      already_authenticated: "Vous êtes déjà connecté."
      inactive: "Votre compte n'est pas encore activé."
      invalid: "Identifiant ou mot de passe invalide."
      locked: "Votre compte est verrouillé."
      last_attempt: "Il vous reste un essai avant que votre compte ne soit verrouillé."
      not_found_in_database: "Identifiant ou mot de passe invalide."
      timeout: "Votre session a expiré. Veuillez vous reconnecter pour continuer."
      unauthenticated: "Vous devez vous connecter ou vous inscrire avant de continuer."
      unconfirmed: "Vous devez confirmer votre compte avant de continuer."
      citizen:
        timeout: "Votre session citoyenne a expiré."
    sessions:
      signed_in: "Connecté avec succès."
      signed_out: "Déconnecté avec succès."
      already_signed_out: "Déconnecté avec succès."

  # === Datetime (Required for Rails view helpers) ===
  datetime:
    distance_in_words:
      about_x_hours:
        one: environ une heure
        other: environ %{count} heures
      about_x_months:
        one: environ un mois
        other: environ %{count} mois
      about_x_years:
        one: environ un an
        other: environ %{count} ans
      almost_x_years:
        one: presque un an
        other: presque %{count} ans
      half_a_minute: une demi‑minute
      less_than_x_seconds:
        zero: moins d'une seconde
        one: moins d'une seconde
        other: moins de %{count} secondes
      less_than_x_minutes:
        zero: moins d'une minute
        one: moins d'une minute
        other: moins de %{count} minutes
      over_x_years:
        one: plus d'un an
        other: plus de %{count} ans
      x_seconds:
        one: "%{count} seconde"
        other: "%{count} secondes"
      x_minutes:
        one: "%{count} minute"
        other: "%{count} minutes"
      x_days:
        one: "%{count} jour"
        other: "%{count} jours"
      x_months:
        one: "%{count} mois"
        other: "%{count} mois"
      x_years:
        one: "%{count} an"
        other: "%{count} ans"
    relative:
      future: "dans %{time}"
      past: "il y a %{time}"

  # === Main Content ===
  main:
    hero:
      title: "L’identité numérique ouverte d’Haïti."
      subtitle: "Verifyem fournit une identité numérique sécurisée et unifiée pour Haïti avec BonID. Elle réduit la fraude, accélère l’accès aux services, protège les citoyens et permet aux institutions de vérifier l’identité instantanément via une seule API."
      cta: "Commencer"
      scan_alt: "Identité vérifiée de %{name}"
      verified_via_html: "Vérifié via <strong>%{org}</strong>"

    matrix:
      title: "Obtenez votre BonID en 3 étapes simples"
      subtitle_html: "Une identité numérique sécurisée pour toute Haïti.<br>Vérifiez une fois. Utilisez partout."
      steps:
        step1:
          title: "1. Téléversez vos documents"
          desc_html: "Téléversez votre CIN, permis de conduire ou passeport, un selfie et un document justificatif.<br><strong>Moins de 2 minutes.</strong>"
        step2:
          title: "2. Faites-vous vérifier"
          desc_html: "Votre identité est examinée de manière sécurisée par l’équipe BonID et vérifiée avec des outils IA avancés.<br><strong>Vérification en moins de 10 secondes.</strong>"
        step3:
          title: "3. Utilisez partout"
          desc: "Une fois vérifié, utilisez votre BonID en Haïti pour les banques, hôpitaux, programmes d’aide, vote et voyages — avec un seul QR code sécurisé."
      cta_line_html: "<strong>Rejoignez plus de 200 000 Haïtiens utilisant déjà BonID</strong>"
      cta_button: "Créer votre BonID maintenant"

    constellation:
      title: "Construisons ensemble une Haïti plus sûre"
      subtitle: "Une vérification d’identité sécurisée entre partenaires de confiance, via un hub BonID central."

    developers:
      title_html: "Conçu pour les développeurs.<br><span class=\"dev-highlight\">API prête pour la production.</span>"
      subtitle: "Intégrez la vérification BonID en quelques minutes. REST, sécurisée, scalable — pensée pour les banques, l’État, les hôpitaux et les applications fintech."
      copy: "Copier"
      copy_aria: "Copier l’exemple API"
      card:
        title: "Simple. Rapide. Sécurisé."
        bullets:
          instant_html: "<strong>Réponse instantanée</strong> en moins de 200ms"
          hmac_html: "Clés API partenaires <strong>sécurisées par HMAC</strong>"
          json: "Profil d’identité complet en JSON"
          envs: "Environnements sandbox & production"
          stacks: "Compatible Rails, Node, Go, Python, PHP"
        cta: "Voir la documentation API"
      code_example: |
        curl -X GET \
          "https://api.bonid.ht" \
          -H "X-Partner-Api-Key: your_api_key_here" \
          -H "Content-Type: application/json"

        # Réponse
        {
          "status": "verified",
          "bonid": "MO-1968-M-OU-P6790H3Z",
          "citizen": {
            "first_name": "Jean",
            "last_name": "Louis",
            "dob": "1984-06-21",
            "sex": "M",
            "age": 41
          },
          "verification": {
            "verified_on": "2025-10-23T14:02:54-04:00",
            "photo_url": "https://...",
            "qr_url": "https://..."
          }
        }

    faq:
      title: "Questions fréquentes"
      subtitle: "Tout ce que vous devez savoir sur BonID, l’identité numérique, la sécurité et son fonctionnement en Haïti."
      items:
        q1:
          q: "Qu’est-ce que BonID ?"
          a_html: "BonID est la première identité numérique sécurisée d’Haïti. Elle vérifie les citoyens et résidents via des dossiers officiels, la biométrie faciale et des contrôles documentaires. Elle vous permet de vous vérifier instantanément partout — banques, hôpitaux, ambassades, programmes d’aide, et plus."
        q2:
          q: "Qu’est-ce que BonTouris ID et en quoi est-ce différent d’iKAT ?"
          a_html: "<strong>BonTouris ID</strong> est votre compagnon numérique privé pendant votre séjour en Haïti. Il fournit un <strong>QR code scannable</strong> permettant aux partenaires autorisés — y compris la Police Nationale d’Haïti (PNH) — de vérifier en temps réel votre séjour légal."
        q3:
          q: "Qu’est-ce que IDPol ?"
          a_html: "IDPol est un outil de vérification moderne créé par <strong>Verifyem</strong> spécifiquement pour la Police Nationale d’Haïti (PNH). Il permet aux agents autorisés de vérifier les identités et de confirmer l’authenticité des documents."
        q4:
          q: "Quel est l’objectif de BonID ?"
          a_html: "BonID fournit une identité numérique sécurisée et unifiée pour Haïti. Elle réduit la fraude, accélère l’accès aux services et protège les citoyens."
        q5:
          q: "De quoi ai-je besoin pour être vérifié ?"
          a_html: "Vous avez besoin d'un CIN ou passeport valide, d'un selfie et d'un document justificatif (acte de naissance, NIF, permis de conduire, etc.)."
        q6:
          q: "BonID remplace-t-il mon CIN ?"
          a_html: "Non. Votre CIN reste votre identité officielle. BonID est votre identité numérique pour une vérification rapide."
        q7:
          q: "Que signifient les lettres dans mon BonID ?"
          a_html: "Un BonID tel que <strong>MO-1968-M-OU-P6790H3Z</strong> est un identifiant structuré contenant des codes de région et de naissance pour une vérification sécurisée."

  # === Error Messages ===
  errors:
    messages:
      not_found: "non trouvé(e)"
      already_confirmed: "a déjà été confirmé(e)"
      not_locked: "n'était pas verrouillé(e)"
