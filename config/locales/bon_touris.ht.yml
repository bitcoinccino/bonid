    # =====================================================
    brand: "BonTouris ID"
    tagline: "Idantite vizitè prive pou Ayiti"

    # =====================================================
    # COMMON
    # =====================================================
    common:
      or: "OSWA"

    # =====================================================
    # ACTIONS
    # =====================================================
    actions:
      continue: "Verifye imèl & tcheke estati"
      resend_code: "Renvoye kòd la"
      verify_email: "Verifye imèl"
      submit: "Soumèt"
      submit_documents: "Voye dokiman yo"
      finish: "Fini"
      back: "Retounen"
      cancel: "Anile"
      yes: "Wi"
      no: "Non"

    # =====================================================
    # FORMS
    # =====================================================
    forms:
      email_placeholder: "ou@example.com"
      otp_label: "Kòd verifikasyon"
      otp_placeholder: "••••••"

    # =====================================================
    # FLASH / NOTICES
    # =====================================================
    notices:
      otp_sent: "Nou voye yon kòd verifikasyon 6 chif sou imèl ou."
      otp_resent: "Nou voye yon nouvo kòd verifikasyon."
      documents_received: "Nou resevwa dokiman ou yo avèk siksè."

    # =====================================================
    # ALERTS / ERRORS
    # =====================================================
    alerts:
      enter_email: "Tanpri antre imèl ou."
      email_required: "Imèl obligatwa."
      email_not_found: "Nou pa jwenn okenn aplikasyon ak imèl sa a."
      application_not_found: "Aplikasyon an pa jwenn."
      invalid_or_expired_code: "Kòd la pa valab oswa li ekspire."
      session_expired: "Sesyon an ekspire. Tanpri mande yon nouvo kòd."
      otp_required: "Tanpri antre kòd verifikasyon an."

    # =====================================================
    # STEPS / FLOW
    # =====================================================
    steps:
      step_1: "Verifikasyon imèl"
      step_2: "Telechaje dokiman"
      step_3: "Estati aplikasyon"

    # =====================================================
    # CAROUSEL
    # =====================================================
    carousel:
      slide: "Glis %{index}"

      primary:
        title: "Kisa BonTouris ID ye?"
        description: >
          Yon idantite dijital tanporè ki pèmèt ou verifye tèt ou
          ak otèl, lopital, ak sèvis lokal ki fè konfyans
          <strong>san ou pa oblije montre paspò ou chak fwa</strong>.

      slides:
        accepted_locally:
          title: "Aksepte lokalman"
          description: "Itilize pa otèl, klinik, sèvis ijans, ak patnè apwouve atravè Ayiti."

        qr_verification:
          title: "Verifikasyon ak QR"
          description: "Verifikasyon imedya ak yon kòd QR sekirize."

        transparent_access:
          title: "Aksè transparan"
          description: "Ou ka wè ki lè ak ki kote yo verifye idantite ou."

        privacy:
          title: "Konfidansyalite an premye"
          description: "Done ou yo ankripte epi pataje sèlman lè sa nesesè."

        real_conditions:
          title: "Fèt pou reyalite Ayiti"
          description: "Fonksyone menm lè koneksyon entènèt limite."

    # =====================================================
    # REQUIREMENTS
    # =====================================================
    requirements:
      title: "Sa w ap bezwen:"
      items:
        passport: "Paspò valab"
        selfie: "Selfie klè"
        passport_photo: "Foto paj paspò a"
        email: "Adrès imèl valab"
      disclaimer: "BonTouris ID pa ranplase paspò ou oswa iKAT."

    # =====================================================
    # DOCUMENT LABELS
    # =====================================================
    documents:
      selfie: "Foto selfie ak figi klè"
      passport: "Foto paj paspò ak foto ak enfòmasyon pèsonèl"

    # =====================================================
    # STATUS LABELS
    # =====================================================
    status:
      pending_email_verification: "Verifikasyon imèl obligatwa"
      pending_review: "An atant revizyon"
      approved: "Apwouve"
      rejected: "Rejte"

    # =====================================================
    # PAGES
    # =====================================================
    pages:
      get_started:
        title: "Tcheke estati BonTouris ID ou"
        description: "Antre imèl ou pou resevwa yon kòd verifikasyon."
        start_new: "Kòmanse yon nouvo aplikasyon"
        duration: "Apeprè 5 minit · Paspò obligatwa"
        email_notice: "Ou pral verifye imèl ou anvan ou kontinye."
        check_status: "Tcheke estati aplikasyon an"
        enter_email: "Antre imèl ou te itilize pou aplikasyon an."
        otp_notice: "🔒 Yon kòd inik 6 chif pral voye sou imèl ou."

      verify_email:
        title: "Verifye imèl ou"
        instruction: "Antre kòd 6 chif yo voye sou imèl ou."
        code_expires: "Kòd sa a ekspire nan 10 minit."

      documents:
        title: "Telechaje dokiman obligatwa yo"
        instruction: "Tanpri telechaje dokiman ki nesesè yo pou verifye idantite ou."

      success:
        title: "BonTouris ID Apwouve"
        subtitle: "Idantite dijital vizitè ou pare."
        message: "Ou kapab itilize BonTouris ID ou pandan tout vwayaj ou nan Ayiti."

    # =====================================================
    # WIZARD (3-STEP REGISTRATION)
    # =====================================================
    wizard:
      subtitle: "Ranpli 3 etap senp pou enskri"
      steps:
        identity: "Idantite"
        travel: "Vwayaj & Sejou"
        contact: "Kontak Lokal"
      next: "Kontinye"
      back: "Retounen"
      scan_passport: "Eskane Paspò"
      scan_hint: "Mete kamera w sou paj enfòmasyon paspò a"
      capture: "Pran Foto"
      cancel: "Anile"
      scanning: "Ap eskane paspò..."
      scan_success: "Paspò eskane avèk siksè!"
      scan_error: "Pa ka li paspò a. Tanpri antre detay yo manyèlman."
      enter_manually: "Antre Manyèlman"
      try_again: "Eseye Ankò"
      liveness:
        title: "Verifikasyon Idantite"
        subtitle: "Fè yon verifikasyon figi rapid pou konfime idantite w"
        retry: "Eseye Ankò"
        comparing: "Ap konpare figi w..."
        match_success: "Idantite verifye!"
        match_fail: "Figi w pa matche ak foto paspò a. Tanpri eseye ankò."
        fallback_hint: "Ou ka pran yon selfi manyèl."
        privacy_note: "Done figi w chifre epi yo pa janm estoke pèmanan"

      resume:
        title: "Kontinye aplikasyon an"
        subtitle: "Antre imèl ou pou kontinye kote ou te sispann"
