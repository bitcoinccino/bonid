    # FAQ tab
    faq_title: "Frequently Asked Questions"
    faq1_q: "Is my vote secret?"
    faq1_a: "Yes, completely. Pedersen Commitment hides your choice. Even the BonVote server cannot see what you voted. When the count is done, only the total is revealed, not individual votes."
    faq2_q: "Can someone vote twice?"
    faq2_a: "Impossible. The ZKP 'nullifier' system detects double votes in 1.74ms. Each citizen has a single unique nullifier that cannot be used twice. Math prevents it, not humans."
    faq3_q: "What if I lose my phone?"
    faq3_a: "Your vote is already sealed in the ledger, not on your phone. You can verify it with your receipt number on any device. If you have not voted yet, you can revoke access with BonID and re-verify on a new device."
    faq4_q: "Is BonVote a magic solution?"
    faq4_a: "No. Experts suggest a full transition can take up to 10 years. It requires public trust, education, and infrastructure. But every election with BonVote is one step closer."
    faq5_q: "What about job losses?"
    faq5_a: "Manual voting provides about 50,000 temporary jobs. BonVote replaces them with fewer but more qualified, better-paid roles: IT technicians, citizen support, cryptographic auditors."
    faq6_q: "Who can verify the results?"
    faq6_a: "Everyone. The public ledger is open to international observers (OAS, UN), media, political parties, and all citizens. The math is public, there are no secrets in the count."

