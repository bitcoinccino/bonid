    # Security tab
    security_title: "Security: Unhackable Technology"
    security_intro: "BonVote uses the same type of cryptography that banks and governments use. Here is how each layer protects your vote."
    pedersen_title: "Pedersen Commitments"
    pedersen_desc: "Hides your choice while committing to it. Even system administrators cannot see your vote until the count is over. Like putting your vote in a safe that cannot be opened until everyone has voted."
    schnorr_title: "Schnorr ZKP (Zero-Knowledge Proofs)"
    schnorr_desc: "Proves you are eligible to vote and your ballot is valid (e.g., you did not vote for 10 candidates) without revealing who you voted for. Math proves it, not humans."
    aes_title: "AES-256-GCM (Authenticated Encryption)"
    aes_desc: "Guarantees ballot data moving from your phone to the server in Port-au-Prince cannot be intercepted or modified. Same security level as international banks."
    biometric_title: "Dual Biometric Verification"
    biometric_desc: "Fingerprint + CIN (National ID Card) number. Citizens and diaspora use BonID for verification. Two layers of security prevent all fraud."
    fraud_title: "Fraud Prevention"
    fraud_desc: "Eliminates 'liste de carence' (party representative voting) irregularities, selling voting passes, and ballot stuffing. The digital system makes all of this impossible."

    # How tab
    how_title: "The Voter Journey"
    step1_title: "Register with ONI"
    step1_desc: "Use your National ID Card (CIN) which already has biometrics (eye scan, fingerprint). BonID is built on top of existing ONI (Office National d'Identification) infrastructure and technology, not replacing it."
    step2_title: "Verify Identity with BonID"
    step2_desc: "Log in and verify your identity through BonID using liveness detection, a live selfie, and document comparison against your CIN or Passport. BonID cross-checks your face and documents with ONI's existing biometric database to confirm you are a real citizen. Local citizens and diaspora use the same system."
    step3_title: "Vote Securely"
    step3_desc: "Choose your candidate. Your vote is encrypted immediately with Pedersen Commitment. No one can see what you voted, not even the server."
    step4_title: "Receive Receipt (Merkle Path)"
    step4_desc: "Receive a unique receipt number. This is your Merkle path, which lets you prove your vote was actually included in the final count. It is the 'Digital Ballot Box'."
    step5_title: "Verify in Public Ledger"
    step5_desc: "Paste your receipt number in the search on the right to confirm your vote is registered. Every vote is a leaf in the Merkle tree."
    step6_title: "Instant Results"
    step6_desc: "Votes go to the national server via internet/intranet. Preliminary results in minutes instead of weeks of manual counting."

    # What tab
    what_title: "What is BonVote?"
    mission_title: "Mission"
    mission_desc: "A decentralized, transparent voting platform for Haiti. Moving away from paper ballots prone to ballot stuffing and toward a mathematically verifiable democracy."
    platform_title: "Mobile Platform"
    platform_desc: "Built for Android and iOS to accommodate most phones in Haiti. Optimized for 3G/4G networks with ZKP proofs small enough to send over a weak signal."
    diaspora_title: "For Diaspora and Local Citizens"
    diaspora_desc: "Millions of Haitians living abroad currently have no remote voting option. BonVote gives them a voice in their country's democracy."
    ledger_title: "Verifiable Ledger"
    ledger_desc: "Not a simple database. It is a verifiable ledger, the highest standard for electoral integrity. Any citizen or observer can verify the election math."

    # Advantages tab
    advantages_title: "BonVote Advantages"
    transparency_title: "Total Transparency"
    transparency_desc: "Thanks to the Merkle Tree, any citizen or international observer can verify the election math without violating voter privacy. OAS, UN, media, everyone can audit."
    inclusion_title: "Diaspora Inclusion"
    inclusion_desc: "Allows millions of Haitians living abroad to participate securely in their country's elections."
    savings_title: "Save $18 Million"
    savings_desc: "Eliminates ballot printing and transporting them across the country's difficult terrain, plus manual counting centers."
    participation_title: "Increase Participation"
    participation_desc: "Turnout in 2016 was only 19%. Easier access can significantly increase it through mobile voting."
    aid_title: "Reduce Foreign Aid Dependency"
    aid_desc: "Lower election costs reduce Haiti's dependency on international funding for its democratic processes."

