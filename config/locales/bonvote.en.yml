    # Results page - How It Works
    results_how_title: "How It Works"
    results_how_sub: "From voting day to the elected nominee — every step verified, encrypted, and transparent."
    results_step1_title: "1. Register with ONI"
    results_step1_desc: "Citizens register on the ONI Electoral List. BonID verifies your identity with biometrics (facial recognition + liveness) to ensure you are who you say you are. Every voter receives a unique BonID."
    results_step2_title: "2. Election Day — Vote"
    results_step2_desc_html: "On your phone or at a voting station (kiosk), you verify your identity with a liveness check. You choose your candidate and submit your vote. The vote is encrypted with <strong style='color:#EDB95E;'>AES-256-GCM</strong> + <strong style='color:#EDB95E;'>Pedersen Commitment</strong> — even BonID cannot see who you voted for."
    results_step3_title: "3. Cryptographic Receipt"
    results_step3_desc_html: "You receive a <strong style='color:#10B981;'>Merkle Path</strong> — mathematical proof that your vote was recorded in the system without revealing who you voted for. You can verify it anytime on the <a href='/election/verify' style='color: #2563EB; text-decoration: none; font-weight: 600;'>public ledger</a>."
    results_step4_title: "4. Ballot Box Sealed"
    results_step4_desc: "When voting ends, the box is sealed with military-grade cryptography. Nobody can see the results — not BonID, not the government, not any technician. Results remain encrypted until the decryption ceremony."
    results_step5_title: "5. Multi-Sig Ceremony (5 of 9)"
    results_step5_desc_html: "To open the ballot box, <strong style='color:#fff;'>5 of 9</strong> independent officials (national observers, international observers, CEP, civil society, technology) must each verify their identity with BonID and enter their private keys. No single person can unlock the results alone."
    results_step6_title: "6. Results Go Live"
    results_step6_desc: "Once 5 signatures are verified, results are decrypted and appear live on this page. Provisional results show in real-time — every counted vote appears instantly. Everyone sees the same results at the same time — no special access, no secret channels."
    results_step7_title: "7. Certification & Winner Declared"
    results_step7_desc_html: "When the contestation period ends, the CEP certifies the final results. The winning candidate is officially declared. The final cryptographic hash is recorded permanently — proof that cannot be changed, erased, or forged. Anyone can verify the authenticity of the results via the <a href='/election/verify' style='color: #2563EB; text-decoration: none; font-weight: 600;'>BonVote public audit <i class='ri-external-link-line' style='font-size: 0.6rem;'></i></a>."
    results_summary_html: "<strong style='color: #fff;'>Every step is auditable, verified, and transparent.</strong><br>No lost ballot boxes. No disappearing ballots. No fabricated results.<br>Every vote counts — and you can prove it."
    results_view: "View Official Results"

