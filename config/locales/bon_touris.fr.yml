fr:
  bon_touris:
    # =====================================================
    # BRAND
    # =====================================================
    brand: "BonTouris ID"
    tagline: "Identité numérique privée pour les visiteurs en Haïti"

    # =====================================================
    # COMMON / GLOBAL
    # =====================================================
    common:
      or: "ou"

    # =====================================================
    # ACTIONS
    # =====================================================
    actions:
      continue: "Vérifier l’email et consulter le statut"
      resend_code: "Renvoyer le code"
      verify_email: "Vérifier l’email"
      submit: "Soumettre"
      submit_documents: "Soumettre les documents"
      finish: "Terminer"
      back: "Retour"
      cancel: "Annuler"
      exit: "Quitter"
      yes: "Oui"
      no: "Non"

    # =====================================================
    # FLASH / NOTICES
    # =====================================================
    notices:
      otp_sent: "Nous avons envoyé un code de vérification à 6 chiffres à votre adresse email."
      otp_resent: "Un nouveau code de vérification a été envoyé."
      documents_received: "Vos documents ont été reçus avec succès."

    # =====================================================
    # ALERTS / ERRORS
    # =====================================================
    alerts:
      enter_email: "Veuillez saisir votre adresse email."
      email_required: "L’adresse email est obligatoire."
      email_not_found: "Aucune demande trouvée avec cette adresse email."
      application_not_found: "Demande introuvable."
      invalid_or_expired_code: "Le code est invalide ou a expiré."
      session_expired: "Session expirée. Veuillez demander un nouveau code."
      otp_required: "Veuillez saisir votre adresse email pour recevoir un code de vérification."

    # =====================================================
    # STEPS / FLOW
    # =====================================================
    steps:
      step_1: "Vérification de l’email"
      step_2: "Téléversement des documents"
      step_3: "Statut"

    # =====================================================
    # FORMS
    # =====================================================
    forms:
      email_placeholder: "vous@exemple.com"
      otp_label: "Code de vérification"
      otp_placeholder: "••••••"

      errors:
        title: "Veuillez corriger les erreurs suivantes :"

      submit:
        primary: "Obtenir mon BonTouris ID"
        processing: "Traitement en cours..."

      legal:
        text_html: "En soumettant, vous acceptez notre %{privacy} et nos %{terms}."
        privacy: "Politique de confidentialité"
        terms: "Conditions d’utilisation"

      passport:
        section_title: "Informations du passeport"
        section_description_html: >
          Saisissez les informations de votre passeport exactement telles qu’elles sont imprimées.
          Ces informations sont utilisées pour vérifier votre identité et générer votre
          <strong>Visitor BonID</strong>.

        issuing_country:
          label: "Passeport délivré par"
          prompt: "Sélectionner le pays émetteur"
          help: "Pays qui a délivré votre passeport (ex. Haïti, France, États-Unis)."
          error: "Le pays émetteur est obligatoire."

        number:
          label: "Numéro de passeport"
          placeholder: "ex. PA1234567"
          help: "Saisissez exactement comme indiqué sur votre passeport (sans espaces ni tirets)."
          error: "Un numéro de passeport valide est requis."

        expiry:
          label: "Date d’expiration du passeport"
          help: "Votre passeport doit être valide pendant toute la durée de votre séjour."
          error: "La date d’expiration du passeport doit être dans le futur."

    # =====================================================
    # PAGES
    # =====================================================
    pages:
      get_started:
        title: "Consulter le statut de votre BonTouris ID"
        description: "Saisissez votre email pour recevoir un code de vérification unique."
        start_new: "Commencer une nouvelle demande"
        duration: "Environ 5 minutes · Passeport requis"
        email_notice: "Vous devrez vérifier votre email avant de continuer."
        check_status: "Vérifier le statut de la demande"
        enter_email: "Saisissez l’email utilisé pour votre demande."
        otp_notice: "Un code unique à 6 chiffres sera envoyé à votre email."

      new:
        title: "Demander un BonTouris ID"
        description_html: >
          BonTouris ID est une <strong>identité numérique temporaire</strong> conçue
          pour une utilisation <strong>pendant votre séjour en Haïti</strong> dans les hôtels,
          hôpitaux, services locaux et partenaires de confiance.
          <br class="d-none d-md-block">
          <strong>Ce n’est pas un document d’immigration ou de voyage</strong> et ne remplace pas
          votre passeport.
        cancel: "Annuler et revenir à la page principale"

      verify_email:
        title: "Vérifiez votre adresse email"
        sent_to: "Nous avons envoyé un code de vérification à 6 chiffres à :"
        instruction: "Saisissez le code pour poursuivre votre demande de BonTouris ID."
        form_title: "Vérification de l’email"
        form_subtitle: "Saisissez le code à 6 chiffres"
        code_expires: "Ce code expire dans 10 minutes."

      documents:
        title: "Téléversez les documents requis"
        subtitle: "Cela prend moins de 2 minutes"
        instruction: "Pour finaliser votre demande, veuillez téléverser les documents requis."

        selfie:
          label: "Selfie (photo de vous)"
          help: "Pas de chapeau, lunettes de soleil ou filtres. Utilisez une lumière naturelle si possible."

        passport_photo:
          label: "Photo du passeport (page d’identité)"
          help: "Assurez-vous que votre nom, photo et numéro de passeport soient clairement visibles."

        affirmation:
          label_html: >
            J’affirme que les informations et documents fournis sont
            <strong>authentiques, exacts et me concernent</strong>.
            Je comprends que la soumission de fausses informations peut entraîner
            le rejet ou la révocation de mon BonTouris ID.
          error: "Vous devez confirmer l’exactitude de vos informations avant de soumettre."

        security_note: "Vos documents sont chiffrés et examinés de manière sécurisée."

        actions:
          submit: "Soumettre pour examen"
          back: "Retour au début"

        final_note: "Après soumission, vous ne pourrez plus modifier ces documents."

      travel_details:
        title: "Détails du voyage et d’entrée"
        subtitle: >
          Détails sur votre arrivée en Haïti.
          Utilisés uniquement pour la vérification locale et la coordination d’urgence.

        entry_mode:
          label: "Comment êtes-vous entré en Haïti ?"
          prompt: "Sélectionner le mode"
          help: "Par avion, mer ou terre."
          error: "Le mode d’entrée est obligatoire."

        port_of_entry:
          label: "Port / Aéroport / Frontière"
          placeholder: "Sélectionner d’abord le mode d’entrée"
          help: "Exemple : Aéroport international Toussaint Louverture (PAP)."
          error: "Le port d’entrée est obligatoire."

        transport_provider:
          label: "Transporteur"
          placeholder: "Sélectionner d’abord le mode d’entrée"
          help: "Exemple : American Airlines, Royal Caribbean."
          error: "Le transporteur est obligatoire."

        transport_reference:
          label: "Référence du transport"
          placeholder: "Numéro de vol, nom du navire ou référence de bus"
          help: "Facultatif mais recommandé."

      personal_information:
        title: "Informations personnelles"
        subtitle: >
          Saisissez vos informations exactement comme sur votre passeport.
          Ces données servent à émettre votre <strong>BonTouris ID</strong>
          pour une utilisation <strong>en Haïti</strong>.

        title_field:
          label: "Civilité"
          prompt: "Sélectionner la civilité"
          error: "Veuillez sélectionner une civilité."

        first_name:
          label: "Prénom"
          placeholder: "John"
          error: "Le prénom est obligatoire."
          help: "Tel qu’écrit sur votre passeport."

        middle_name:
          label: "Deuxième prénom"
          placeholder: "Facultatif"
          help: "Laisser vide si aucun."

        last_name:
          label: "Nom de famille"
          placeholder: "Doe"
          error: "Le nom de famille est obligatoire."

        dob:
          label: "Date de naissance"
          help: "Utilisée pour valider l’âge et le format du BonTouris ID."

        sex:
          label: "Sexe"
          prompt: "Sélectionner"
          help: "Tel qu’indiqué sur votre passeport (M / F / O)."

        nationality:
          label: "Nationalité"
          prompt: "Sélectionner la nationalité"
          help: "Pays qui a délivré votre passeport."

        residence_country:
          label: "Pays / Région de résidence"
          prompt: "Sélectionner le pays de résidence"
          help: "Où vous vivez actuellement ou votre base principale."

      accommodation:
        title: "Séjour en Haïti"
        subtitle: >
          Informations sur votre séjour en Haïti.
          Cela aide à la vérification, au contact d’urgence et aux services locaux.

        purpose:
          label: "Objet de la visite"
          prompt: "Sélectionner l’objet"
          error: "L’objet de la visite est obligatoire."
          help: "Exemple : Tourisme, Affaires, Visite familiale."

        duration:
          label: "Durée prévue du séjour (jours)"
          placeholder: "ex. 14"
          error: "La durée du séjour doit être comprise entre 1 et 365 jours."
          help: "Maximum 1 an pour la validité du Visitor BonID."

        place_name:
          label: "Nom de l’établissement"
          placeholder: "ex. Hotel Karibe"
          help: "Hôtel, maison d’hôtes, Airbnb ou nom de l’hôte."

        type:
          label: "Type"
          prompt: "Sélectionner le type"

          options:
            hotel: "Hôtel"
            guesthouse: "Maison d’hôtes"
            airbnb: "Airbnb"
            family: "Domicile familial"
            other: "Autre"

        address:
          street:
            label: "Adresse rue"
            placeholder: "Rue Chavannes, Delmas 33"
            help: "Adresse détaillée pour la localisation et les services d’urgence."

          department:
            label: "Département"
            prompt: "Sélectionner le département"
            help: "Exemple : Ouest, Artibonite, Nord."

          arrondissement:
            label: "Arrondissement"
            prompt: "Sélectionner l’arrondissement"

          commune:
            label: "Commune"
            prompt: "Sélectionner la commune"

          section:
            label: "Section communale"
            prompt: "Sélectionner la section communale"

          postal_code:
            label: "Code postal"
            placeholder: "Rempli automatiquement"

          error: "⚠️ Erreur lors du chargement des données d’adresse."

      contact_information:
        title: "Coordonnées"
        subtitle_html: >
          Nous enverrons votre <strong>code QR BonTouris ID</strong> et les mises à jour ici.
          Cet ID est destiné à une <strong>utilisation en Haïti</strong>
          (hôtels, hôpitaux, services locaux) — pas pour l’immigration ou le contrôle aux frontières.

        email:
          label: "Adresse email"
          placeholder: "vous@exemple.com"
          error: "Une adresse email valide est requise."
          help: "Votre code QR sera livré par email en moins d’1 minute."

        phone:
          label: "Numéro de téléphone"
          optional: "(facultatif)"
          country_code_prompt: "Code pays"
          placeholder: "Numéro de téléphone"
          help: "Facultatif. Utilisé uniquement pour les rappels (ex. alertes d’expiration)."

      success:
        thank_you: "Merci"
        selfie_alt: "Selfie du visiteur"

        left:
          approved_title: "Votre <strong>BonTouris ID</strong> a été approuvé."
          approved_message: "Vous pouvez désormais utiliser votre BonTouris ID pendant votre séjour en Haïti."

          pending_title: "Votre demande de <strong>BonTouris ID</strong> a été soumise."
          pending_message: "Notre équipe de vérification examine vos informations."

          rejected_title: "Votre demande nécessite une attention."
          rejected_message: "Veuillez consulter votre email pour les prochaines étapes."

        status:
          approved:
            title: "BonTouris ID approuvé"
            subtitle: "Votre identité numérique de visiteur a été émise."

          pending:
            title: "Demande BonTouris ID en cours d’examen"
            subtitle: "Vos documents sont en cours de vérification."

          rejected:
            title: "Action requise"
            subtitle: "Votre demande de BonTouris ID n’a pas pu être approuvée."

        labels:
          bon_touris_id: "BonTouris ID"
          reference_id: "ID de référence"

    # =====================================================
    # CAROUSEL
    # =====================================================
    carousel:
      slide: "Diapositive %{index}"

      primary:
        title: "Qu’est-ce que BonTouris ID ?"
        description: >
          Une identité numérique temporaire qui vous permet de vous identifier
          auprès des hôtels, hôpitaux et services locaux de confiance
          <strong>sans avoir à montrer votre passeport à chaque fois</strong>.

      slides:
        accepted_locally:
          title: "Accepté localement"
          description: "Utilisé par les hôtels, cliniques, services d’urgence et partenaires agréés à travers Haïti."

        qr_verification:
          title: "Vérification par QR"
          description: "Vérification instantanée grâce à un code QR sécurisé."

        transparent_access:
          title: "Accès transparent"
          description: "Vous pouvez voir exactement quand et où votre identité a été vérifiée."

        privacy:
          title: "Confidentialité prioritaire"
          description: "Vos données sont chiffrées et partagées uniquement lorsque nécessaire."

        real_conditions:
          title: "Conçu pour la réalité haïtienne"
          description: "Fonctionne de manière fiable même avec une connectivité limitée."

    # =====================================================
    # REQUIREMENTS
    # =====================================================
    requirements:
      title: "Ce dont vous aurez besoin"
      disclaimer: "BonTouris ID ne remplace pas votre passeport ni l’iKAT."

      items:
        passport: "Passeport valide"
        selfie: "Selfie clair"
        passport_photo: "Photo de la page du passeport"
        email: "Adresse email valide"

    # =====================================================
    # STATUS LABELS
    # =====================================================
    status:
      pending_email_verification: "Vérification de l’email requise"
      pending_review: "En attente d’examen"
      approved: "Approuvé"
      rejected: "Rejeté"

    # =====================================================
    # WIZARD (3-STEP REGISTRATION)
    # =====================================================
    wizard:
      subtitle: "Complétez 3 étapes simples pour vous inscrire"
      steps:
        identity: "Identité"
        travel: "Voyage & Séjour"
        contact: "Contact Local"
      next: "Continuer"
      back: "Retour"
      scan_passport: "Scanner le Passeport"
      scan_hint: "Pointez votre caméra vers la page d'informations du passeport"
      capture: "Capturer"
      cancel: "Annuler"
      scanning: "Numérisation du passeport..."
      scan_success: "Passeport numérisé avec succès !"
      scan_error: "Impossible de lire le passeport. Veuillez saisir les détails manuellement."
      enter_manually: "Saisir Manuellement"
      try_again: "Réessayer"
      liveness:
        title: "Vérification d'Identité"
        subtitle: "Effectuez une vérification rapide du visage"
        retry: "Réessayer"
        comparing: "Comparaison de votre visage..."
        match_success: "Identité vérifiée !"
        match_fail: "Votre visage ne correspond pas à la photo du passeport."
        fallback_hint: "Vous pouvez prendre un selfie manuel."
        privacy_note: "Vos données faciales sont chiffrées et ne sont jamais stockées de façon permanente"

    # =====================================================
    # RESUME FLOW
    # =====================================================
    resume:
      title: "Reprendre votre demande"
      subtitle: "Saisissez votre email pour continuer"