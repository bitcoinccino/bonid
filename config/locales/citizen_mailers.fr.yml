# Citizen emails sent in the citizen's portal language (French).
# English lives in main.en.yml (mailers.access.*); the layout falls back
# to its English defaults.
fr:
  mailers:
    layout:
      bonid_tagline_1: "Une identité numérique privée, pas une pièce d’identité officielle."
      bonid_tagline_2: "Vérifiez une fois, utilisez partout."
      rights: "Tous droits réservés"
    access:
      badge: "Vos informations"
      greeting: "Bonjour %{name},"
      manage_button: "Voir qui peut voir vos informations"
      not_you_title: "Ce n’était pas vous ?"
      granted:
        subject: "BonID : %{partner_name} peut désormais voir vos informations"
        heading: "%{partner_name} peut désormais voir vos informations"
        body: "Vous avez autorisé %{partner_name} à voir certaines de vos informations BonID."
        what_they_see: "Ce que %{partner_name} peut voir"
        ends_on: "Cet accès prend fin le %{date}. Vous pouvez le retirer à tout moment."
        not_you_body: "Retirez dès maintenant l’accès de %{partner_name} et contactez support@bonid.ht."
      removed:
        subject: "BonID : %{partner_name} ne peut plus voir vos informations"
        heading: "%{partner_name} ne peut plus voir vos informations"
        body: "Vous avez retiré l’accès de %{partner_name} le %{date}."
        point_stop: "%{partner_name} ne peut plus voir vos informations."
        point_delete: "Il doit supprimer les informations déjà obtenues sous 30 jours."
        point_again: "Vous pourrez redonner l’accès plus tard si vous changez d’avis."
        not_you_body: "Quelqu’un utilise peut-être votre compte. Contactez immédiatement support@bonid.ht."
