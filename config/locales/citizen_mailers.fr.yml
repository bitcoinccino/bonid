# Citizen emails sent in the citizen's portal language (French).
# English lives in main.en.yml (mailers.access.*); the layout falls back
# to its English defaults.
fr:
  mailers:
    layout:
      bonid_tagline_1: "Une identité numérique privée, pas une pièce d’identité officielle."
      bonid_tagline_2: "Vérifiez une fois, utilisez partout."
      rights: "Tous droits réservés"
    waitlist_confirmation:
      subject: "Vous êtes inscrit !"
      heading: "Vous êtes inscrit !"
      greeting: "Bonjour %{name},"
      intro_commune: "Merci de vous être inscrit à BonID à %{commune}. Nous vous écrirons dès que BonID y sera disponible."
      intro: "Merci de vous être inscrit à BonID. Nous vous écrirons dès que BonID sera disponible pour vous."
      count: "%{count} personnes déjà inscrites à %{commune}"
      mission: "Pour la première fois, vous gardez le contrôle de vos informations : vous voyez où elles ont été utilisées et vous ne partagez que ce que vous voulez."
      share_title: "Partagez votre lien pour que vos proches s'inscrivent aussi :"
      whatsapp: "Partager sur WhatsApp"
      share_text: "Je viens de m'inscrire à BonID, la première identité numérique sécurisée d'Haïti. Inscris-toi aussi : %{url}"
      signoff: "L’équipe BonID"
    waitlist_common:
      greeting: "Bonjour %{name},"
      create: "Créer mon compte"
      what_is_title: "Qu'est-ce que BonID ?"
      what_is_body: "La première identité numérique sécurisée d'Haïti. Vous gardez le contrôle total de vos informations : vous voyez où elles ont été utilisées et vous ne partagez que ce que vous voulez."
      help: "Besoin d'aide ? Écrivez-nous à"
      signoff: "L’équipe BonID"

    waitlist_launch:
      subject: "BonID est disponible à %{commune} !"
      heading: "BonID est disponible à %{commune} !"
      body: "Bonne nouvelle ! BonID est officiellement lancé à %{commune}. Vous étiez sur la liste d'attente : vous pouvez maintenant créer votre compte."
      ready: "Votre compte est prêt à être créé"

    waitlist_invitation:
      subject: "Vous êtes invité sur BonID ! Créez votre compte"
      heading: "BonID est prêt pour vous !"
      body: "Vous vous êtes inscrit sur la liste d'attente BonID, et nous sommes prêts pour vous. Cliquez sur le bouton pour créer votre compte."
      code: "Votre code d'invitation :"
    otp_login:
      subject: "BonID : votre code de connexion"
      heading: "Connexion à BonID"
      lead_html: "Utilisez ce code pour vous connecter en toute sécurité. Il expire dans <strong>10 minutes</strong> et ne peut être utilisé qu’une seule fois."
      expiry: "Ce code expire dans 10 minutes et ne peut être utilisé qu’une seule fois."
      code_label: "Code à usage unique"
      greeting: "Bonjour %{name},"
      body: "Saisissez le code ci-dessus pour terminer la connexion à votre compte BonID."
      not_you: "Si vous n’avez pas demandé ce code, vous pouvez ignorer cet e-mail."
      help: "Besoin d’aide ? Écrivez à"
      signoff: "L’équipe BonID"
    access:
      badge: "Vos informations"
      greeting: "Bonjour %{name},"
      manage_button: "Voir qui peut voir vos informations"
      not_you_title: "Ce n’était pas vous ?"
      granted:
        subject: "BonID : %{partner_name} peut désormais voir vos informations"
        heading: "%{partner_name} peut désormais voir vos informations"
        body: "Vous avez autorisé %{partner_name} à voir certaines de vos informations BonID."
        what_they_see: "Ce que %{partner_name} peut voir"
        ends_on: "Cet accès prend fin le %{date}. Vous pouvez le retirer à tout moment."
        not_you_body: "Retirez dès maintenant l’accès de %{partner_name} et contactez support@verifyem.ht."
      removed:
        subject: "BonID : %{partner_name} ne peut plus voir vos informations"
        heading: "%{partner_name} ne peut plus voir vos informations"
        body: "Vous avez retiré l’accès de %{partner_name} le %{date}."
        point_stop: "%{partner_name} ne peut plus voir vos informations."
        point_delete: "Il doit supprimer les informations déjà obtenues sous 30 jours."
        point_again: "Vous pourrez redonner l’accès plus tard si vous changez d’avis."
        not_you_body: "Quelqu’un utilise peut-être votre compte. Contactez immédiatement support@verifyem.ht."

    citizen_common:
      greeting: "Bonjour %{name},"
      greeting_html: "Bonjour <strong>%{name}</strong>,"
      status: "Statut :"
      signoff: "L’équipe BonID"
      support_html: "Besoin d’aide ? Écrivez-nous à <a href=\"mailto:support@verifyem.ht\">support@verifyem.ht</a>."
    identity_submission:
      received:
        subject: "BonID : nous avons reçu votre demande de vérification"
        heading: "Vérification envoyée"
        status: "En cours d’examen"
        status_note: "Notre équipe de vérification examine votre demande."
        body: "Merci d’avoir envoyé votre vérification d’identité. Nos vérificateurs contrôlent vos documents pour confirmer votre BonID."
        button: "Voir ma demande"
        closing: "Une fois approuvé, vous recevrez votre QR code BonID, à utiliser auprès d’institutions de confiance comme les banques, les ambassades et la police."
      approved:
        subject: "BonID : votre vérification est approuvée !"
        heading: "BonID approuvé"
        status: "Approuvé"
        status_note: "Votre BonID est maintenant actif et prêt à l’emploi."
        body: "Félicitations. Votre vérification BonID a été approuvée. Vous pouvez maintenant utiliser votre QR code BonID pour prouver votre identité auprès d’institutions de confiance comme les banques, les ambassades et la police."
        button: "Voir mon BonID"
        closing: "Merci d’avoir effectué votre vérification d’identité avec BonID."
      rejected:
        subject: "BonID : votre demande n’a pas été approuvée"
        heading: "BonID non approuvé"
        status: "Non approuvé"
        status_note: "Votre demande ne remplit pas les conditions de vérification."
        body: "Malheureusement, votre vérification BonID n’a pas pu être approuvée cette fois. Vous pouvez consulter le motif et renvoyer vos documents."
        button: "Voir ma demande"
      reset_requested:
        subject: "BonID : demande de réinitialisation reçue"
        heading: "Demande de réinitialisation reçue"
        status: "En cours d’examen"
        status_note: "Votre demande de réinitialisation de BonID est en cours d’examen."
        body: "Nous avons reçu votre demande de réinitialisation de BonID. Notre équipe vérifiera les informations fournies avant d’émettre un nouveau BonID."
        button: "Voir mes demandes"
        closing: "Nous vous écrirons à nouveau dès que votre demande sera approuvée ou refusée."
      reset_approved:
        subject: "BonID : réinitialisation approuvée"
        heading: "Réinitialisation approuvée"
        status: "Approuvé"
        status_note: "Un nouveau BonID vous a été émis."
        body: "Votre demande de réinitialisation de BonID a été approuvée. Votre ancien QR code ne fonctionne plus et un nouveau a été créé pour votre compte."
        button: "Voir mon nouveau BonID"
        closing: "Vérifiez que toutes vos informations sont correctes et gardez votre BonID en sécurité."
      reset_rejected:
        subject: "BonID : réinitialisation non approuvée"
        heading: "Réinitialisation non approuvée"
        status: "Non approuvé"
        status_note: "Votre demande de réinitialisation de BonID n’a pas été approuvée."
        body: "Nous avons examiné votre demande de réinitialisation, mais elle ne remplit pas les conditions. Assurez-vous que vos documents et informations sont valides avant de la renvoyer."
        button: "Envoyer une nouvelle demande"
    qr_scan:
      subject: "BonID : votre BonID a été vérifié le %{date}"
      heading: "Votre BonID a été vérifié"
      body: "Quelqu’un vient de vérifier votre BonID pour confirmer votre identité."
      who: "Qui :"
      when: "Quand :"
      where: "Où :"
      where_value: "près de %{place}"
      who_police: "%{name} (police)"
      police_default: "Un policier"
      who_camera: "Quelqu’un avec l’appareil photo d’un téléphone"
      not_you_title: "Ce n’était pas vous ?"
      not_you: "Quelqu’un a peut-être une photo de votre QR code. Contactez support@verifyem.ht immédiatement."
      button: "Voir mon activité"
      date_format: "%-d %b %Y"
      time_format: "%-d %b %Y à %H:%M"
    name_change:
      subject: "BonID : changement de nom approuvé. Nouvelle vérification requise"
      heading: "Changement de nom approuvé"
      body_html: "Votre demande de changement de nom de <strong>%{old}</strong> à <strong>%{new}</strong> a été approuvée."
      required: "Nouvelle vérification requise"
      steps_intro: "Pour que le nouveau nom prenne effet, vous devez :"
      step1: "Téléverser votre nouvelle CIN ou votre passeport avec le nouveau nom"
      step2: "Faire la vérification du visage en direct"
      step3: "Envoyer une nouvelle demande de BonID"
      button: "Aller à mon tableau de bord"
      not_you: "Si vous n’avez pas demandé ce changement, contactez support@verifyem.ht immédiatement."
