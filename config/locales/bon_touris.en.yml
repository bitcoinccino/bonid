en:
  bon_touris:
    # =====================================================
    # BRAND
    # =====================================================
    brand: "BonTouris ID"
    tagline: "Private visitor identity for Haiti"

    # =====================================================
    # COMMON / GLOBAL
    # =====================================================
    common:
      or: "or"

    # =====================================================
    # ACTIONS
    # =====================================================
    actions:
      continue: "Verify Email & Check Status"
      resend_code: "Resend code"
      verify_email: "Verify email"
      submit: "Submit"
      submit_documents: "Submit documents"
      finish: "Finish"
      back: "Back"
      cancel: "Cancel"
      exit: "Exit"
      yes: "Yes"
      no: "No"
      retry: "Retry"

    # =====================================================
    # FLASH / NOTICES
    # =====================================================
    notices:
      otp_sent: "We’ve sent a 6-digit verification code to your email."
      otp_resent: "A new verification code has been sent."
      documents_received: "Your documents have been received successfully."

    # =====================================================
    # ALERTS / ERRORS
    # =====================================================
    alerts:
      enter_email: "Please enter your email."
      email_required: "Please enter your email."
      email_not_found: "We couldn’t find an application for that email."
      application_not_found: "Application not found."
      invalid_or_expired_code: "Invalid or expired verification code."
      session_expired: "Session expired. Enter your email to get a new code."
      otp_required: "Enter your email to receive a verification code."
      application_not_approved: "Your BonTouris ID application has not been approved yet. Please check your email for details or contact support."
      link_expired_or_invalid: "This link has expired or is invalid. Please start a new application."
    # =====================================================
    # STEPS / FLOW
    # =====================================================
    steps:
      step_1: "Email Verification"
      step_2: "Upload Documents"
      step_3: "Application Status"

    # =====================================================
    # ENUMS (for form selects, etc.)
    # =====================================================
    enums:
      entry_mode:
        air: "By Air"
        sea: "By Sea"
        land: "By Land"

      accommodation_type:
        hotel: "Hotel"
        guesthouse: "Guesthouse"
        airbnb: "Airbnb"
        family: "Family home"
        other: "Other"

      purpose_of_visit:
        tourism: "Tourism"
        business: "Business"
        family_visit: "Family visit"
        other: "Other"

      title:
        mr: "Mr."
        mrs: "Mrs."
        ms: "Ms."
        dr: "Dr."
        prof: "Prof."

      sex:
        m: "Male"
        f: "Female"
        o: "Other"

    # =====================================================
    # FORMS
    # =====================================================
    forms:
      email_placeholder: "you@example.com"
      otp_label: "Verification code"
      otp_placeholder: "••••••"

      errors:
        title: "Please fix the following errors:"

      submit:
        primary: "Get My BonTouris ID"
        processing: "Processing..."

      legal:
        text_html: "By submitting, you agree to our %{privacy} and %{terms}."
        privacy: "Privacy Policy"
        terms: "Terms of Service"

      passport:
        section_title: "Passport Information"
        section_description_html: >
          Enter your passport details exactly as printed.
          This information is used to verify your identity and generate your
          <strong>Visitor BonID</strong>.

        issuing_country:
          label: "Passport issued by"
          prompt: "Select issuing country"
          help: "Country that issued your passport (e.g. Haiti, France, USA)."
          error: "Issuing country is required."

        number:
          label: "Passport number"
          placeholder: "e.g., PA1234567"
          help: "Enter exactly as shown on your passport (no spaces or dashes)."
          error: "A valid passport number is required."

        expiry:
          label: "Passport expiration date"
          help: "Your passport must be valid for the duration of your stay."
          error: "Passport expiration date must be in the future."

    # =====================================================
    # PAGES
    # =====================================================
    pages:
      get_started:
        title: "Check your BonTouris ID status"
        description: "Enter your email to receive a one-time verification code."
        start_new: "Start a new application"
        duration: "Approximately 5 minutes · Passport required"
        email_notice: "You’ll verify your email before continuing."
        check_status: "Check application status"
        enter_email: "Enter the email you used for your application."
        otp_notice: "A unique 6-digit code will be sent to your email."

      new:
        title: "Apply for a BonTouris ID"
        description_html: >
          BonTouris ID is a <strong>temporary digital identity</strong> designed
          for use <strong>while you are in Haiti</strong> for hotels, hospitals,
          local services, and trusted partners.
          <br class="d-none d-md-block">
          <strong>It is not an immigration or travel document</strong> and does not
          replace your passport.
        cancel: "Cancel and return to main page"

      verify_email:
        title: "Verify your email"
        sent_to: "We sent a 6-digit verification code to:"
        instruction: "Enter the code to continue your BonTouris ID application."
        form_title: "Email verification"
        form_subtitle: "Enter the 6-digit code"
        code_expires: "This code expires in 10 minutes."

      documents:
        title: "Upload Required Documents"
        subtitle: "This takes less than 2 minutes"
        instruction: "To complete your application, please upload the required documents."
        duration_html: "<strong>Less than 2 minutes</strong> to complete"

        selfie:
          label: "Selfie (photo of you)"
          help: "No hats, sunglasses, or filters. Use natural light if possible."

        passport:
          label: "Passport photo (identity page)"
          help: "Ensure your name, photo, and passport number are clearly visible."

        affirmation:
          text_html: >
            I affirm that the information and documents provided are
            <strong>true, accurate, and belong to me</strong>.
            I understand that submitting false information may result in
            rejection or revocation of my BonTouris ID.
          error: "You must confirm the accuracy of your information before submitting."

        security_note: "Your documents are encrypted and reviewed securely."

        actions:
          submit: "Submit for Review"
          back: "Back to start"

        final_note: "After submission, you won’t be able to edit these documents."

      travel_details:
        title: "Travel & Entry Details"
        subtitle: >
          Details about how you arrived in Haiti.
          Used for local verification and emergency coordination only.

        entry_mode:
          label: "How did you enter Haiti?"
          prompt: "Select mode"
          help: "Air, sea, or land."
          error: "Entry mode is required."

        port_of_entry:
          label: "Port / Airport / Border"
          prompt: "Select entry mode first"
          placeholder: "Select entry mode first"
          help: "Example: Toussaint Louverture International Airport (PAP)."
          error: "Port of entry is required."

        transport_provider:
          label: "Transport provider"
          prompt: "Select entry mode first"
          placeholder: "Select entry mode first"
          help: "Example: American Airlines, Royal Caribbean."
          error: "Transport provider is required."

        transport_reference:
          label: "Transport reference"
          placeholder: "Flight number, vessel name, or bus reference"
          help: "Optional but recommended."

      personal_information:
        title: "Personal Information"
        subtitle: >
          Enter your details exactly as shown on your passport.
          This information is used to issue your <strong>BonTouris ID</strong>
          for use <strong>within Haiti</strong>.

        title_field:
          label: "Title"
          prompt: "Select title"
          error: "Please select a title."

        first_name:
          label: "First name"
          placeholder: "John"
          error: "First name is required."
          help: "As written on your passport."

        middle_name:
          label: "Middle name"
          placeholder: "Optional"
          help: "Leave blank if none."

        last_name:
          label: "Last name"
          placeholder: "Doe"
          error: "Last name is required."

        dob:
          label: "Date of birth"
          help: "Used to validate age and BonTouris ID format."

        sex:
          label: "Sex"
          prompt: "Select"
          help: "As indicated on your passport (M / F / O)."

        nationality:
          label: "Nationality"
          prompt: "Select nationality"
          help: "Country that issued your passport."

        residence_country:
          label: "Country / Region of residence"
          prompt: "Select country of residence"
          help: "Where you currently live or are based."

      accommodation:
        title: "Stay in Haiti"
        subtitle: >
          Information about your stay in Haiti.
          This helps with verification, emergency contact, and local services.

        purpose:
          label: "Purpose of visit"
          prompt: "Select purpose"
          error: "Purpose of visit is required."
          help: "Example: Tourism, Business, Family visit."

        duration:
          label: "Expected stay (days)"
          placeholder: "e.g., 14"
          error: "Stay duration must be between 1 and 365 days."
          help: "Maximum 1 year for Visitor BonID validity."

        place_name:
          label: "Name of place"
          placeholder: "e.g., Hotel Karibe"
          help: "Hotel, guesthouse, Airbnb, or host’s name."

        type:
          label: "Type"
          prompt: "Select type"

          options:
            hotel: "Hotel"
            guesthouse: "Guesthouse"
            airbnb: "Airbnb"
            family: "Family home"
            other: "Other"

        address:
          street:
            label: "Street address"
            placeholder: "Rue Chavannes, Delmas 33"
            help: "Detailed address for location and emergency services."

          department:
            label: "Department"
            prompt: "Select Department"
            help: "Example: Ouest, Artibonite, Nord."

          arrondissement:
            label: "Arrondissement"
            prompt: "Select Arrondissement"

          commune:
            label: "Commune"
            prompt: "Select Commune"

          section:
            label: "Communal section"
            prompt: "Select Section Communale"

          postal_code:
            label: "Postal code"
            placeholder: "Auto-filled"

          error: "⚠️ Error loading address data."

      contact_information:
        title: "Contact Information"
        subtitle_html: >
          We’ll send your <strong>BonTouris ID QR code</strong> and updates here.
          This ID is for <strong>use inside Haiti</strong>
          (hotels, hospitals, local services) — not for immigration or border control.

        email:
          label: "Email address"
          placeholder: "you@example.com"
          error: "A valid email address is required."
          help: "Your QR code is delivered by email within 1 minute."

        phone:
          label: "Phone number"
          optional: "(optional)"
          country_code_prompt: "Country code"
          placeholder: "Phone number"
          help: "Optional. Used only for reminders (e.g. expiration alerts)."

      success:
        thank_you: "Thank you"
        selfie_alt: "Visitor selfie"

        toggle:
          qr: "QR Code"
          certificate: "Certificate"
        download_pdf: "Download Certificate (PDF)"

        rejection:
          title: "Action Required"
          reason: "Reason for rejection"
          reason_label: "Reason"
          notes_label: "Additional details"
          cta: "Start a New Application"

        left:
          approved_title: "Your <strong>BonTouris ID</strong> has been approved."
          approved_message: "You may now use your BonTouris ID while staying in Haiti."

          pending_title: "Your <strong>BonTouris ID</strong> application has been submitted."
          pending_message: "Our verification team is reviewing your information."

          rejected_title: "Your application requires attention."
          rejected_message: "Please check your email for next steps."

        status:
          approved:
            title: "BonTouris ID Approved"
            subtitle: "Your digital visitor identity has been issued."

          pending:
            title: "BonTouris ID Application Under Review"
            subtitle: "Your documents are being reviewed."

          rejected:
            title: "Action Required"
            subtitle: "Your BonTouris ID application could not be approved."

        labels:
          bon_touris_id: "BonTouris ID"
          reference_id: "Reference ID"

    # =====================================================
    # CAROUSEL
    # =====================================================
    carousel:
      slide: "Slide %{index}"

      primary:
        title: "What is BonTouris ID?"
        description: >
          A temporary digital ID that lets you verify yourself to trusted
          hotels, hospitals, and local services
          <strong>without repeatedly showing your passport</strong>.

      slides:
        accepted_locally:
          title: "Accepted locally"
          description: "Used by hotels, clinics, emergency services, and approved partners across Haiti."

        qr_verification:
          title: "QR-based verification"
          description: "Instant verification using a secure QR code."

        transparent_access:
          title: "Transparent access"
          description: "You can see exactly when and where your identity was verified."

        privacy:
          title: "Privacy by design"
          description: "Your data is encrypted and shared only when necessary."

        real_conditions:
          title: "Built for real conditions"
          description: "Designed to work reliably with limited connectivity."

    # =====================================================
    # REQUIREMENTS
    # =====================================================
    requirements:
      title: "What you’ll need"
      disclaimer: "BonTouris ID does not replace your passport or iKAT."

      items:
        passport: "Valid passport"
        selfie: "Clear selfie"
        passport_photo: "Photo of your passport page"
        email: "Valid email address"

    # =====================================================
    # STATUS LABELS
    # =====================================================
    status:
      pending_email_verification: "Email verification required"
      pending_review: "Pending review"
      approved: "Approved"
      rejected: "Rejected"

    # =====================================================
    # WIZARD (3-STEP REGISTRATION)
    # =====================================================
    wizard:
      subtitle: "Complete 3 simple steps to register"
      steps:
        identity: "Identity"
        travel: "Travel & Stay"
        contact: "Local Contact"
      next: "Continue"
      back: "Back"
      scan_passport: "Scan Passport"
      scan_hint: "Point your camera at the passport information page"
      capture: "Capture"
      cancel: "Cancel"
      scanning: "Scanning passport..."
      scan_success: "Passport scanned successfully!"
      scan_error: "Could not read passport. Please enter details manually."
      enter_manually: "Enter Manually"
      try_again: "Try Again"
      liveness:
        title: "Identity Verification"
        subtitle: "Complete a quick face check to verify your identity"
        retry: "Retry Check"
        comparing: "Comparing your face..."
        match_success: "Identity verified!"
        match_fail: "Your face does not match the passport photo. Please try again."
        fallback_hint: "Having trouble? You can take a manual selfie instead."
        privacy_note: "Your face data is encrypted and never stored permanently"

    # =====================================================
    # RESUME FLOW
    # =====================================================
    resume:
      title: "Resume your application"
      subtitle: "Enter your email to continue"