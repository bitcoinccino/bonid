      empty: "pa ka vid"
      equal_to: "dwe egal a %{count}"
      even: "dwe pa"
      exclusion: "rezève"
      greater_than: "dwe pi gran pase %{count}"
      greater_than_or_equal_to: "dwe pi gran oswa egal a %{count}"
      inclusion: "pa enkli nan lis la"
      invalid: "pa valab"
      less_than: "dwe mwens pase %{count}"
      less_than_or_equal_to: "dwe mwens oswa egal a %{count}"
      model_invalid: "Validasyon echwe: %{errors}"
      not_a_number: "pa yon nimewo"
      not_an_integer: "dwe yon antye"
      odd: "dwe enpa"
      other_than: "dwe diferan de %{count}"
      present: "dwe vid"
      required: "dwe egziste"
      taken: "deja pran"
      too_long:
        one: "twò long (maksimòm se 1 karaktè)"
        other: "twò long (maksimòm se %{count} karaktè)"
      too_short:
        one: "twò kout (minimòm se 1 karaktè)"
        other: "twò kout (minimòm se %{count} karaktè)"
      wrong_length:
        one: "move longè (dwe 1 karaktè)"
        other: "move longè (dwe %{count} karaktè)"
