        one: "1 mwa"
        other: "%{count} mwa"
      about_x_years:
        one: "apeprè 1 lane"
        other: "apeprè %{count} lane"
      over_x_years:
        one: "plis pase 1 lane"
        other: "plis pase %{count} lane"
      almost_x_years:
        one: "prèske 1 lane"
        other: "prèske %{count} lane"
    prompts:
      second: "Segond"
      minute: "Minit"
      hour: "Èdtan"
      day: "Jou"
      month: "Mwa"
      year: "Lane"

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d %B %Y"
    day_names:
      - dimanch
      - lendi
      - madi
      - mèkredi
      - jedi
      - vandredi
      - samdi
    abbr_day_names:
      - dim
      - len
      - mad
      - mèk
      - jed
      - van
      - sam
    month_names:
      - ~
      - janvye
      - fevriye
      - mas
      - avril
      - me
      - jen
      - jiyè
      - out
      - septanm
      - oktòb
      - novanm
      - desanm
    abbr_month_names:
      - ~
      - jan
      - fev
      - mas
      - avr
      - me
      - jen
      - jiy
      - out
      - sep
      - okt
      - nov
      - des
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%a, %d %b %Y %H:%M:%S %z"
      short: "%d %b %H:%M"
      long: "%d %B %Y %H:%M"
    am: "AM"
    pm: "PM"

  number:
    format:
      separator: ","
      delimiter: " "
      precision: 3
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u"
        unit: "HTG"
        separator: ","
        delimiter: " "
        precision: 2
        significant: false
        strip_insignificant_zeros: false
    percentage:
      format:
        delimiter: ""
        format: "%n%"
    precision:
      format:
        delimiter: ""
    human:
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "Byte"
            other: "Bytes"
          kb: "KB"
          mb: "MB"
          gb: "GB"
          tb: "TB"
          pb: "PB"
          eb: "EB"
      decimal_units:
        format: "%n %u"
        units:
          unit: ""
          thousand: "Mil"
          million: "Milyon"
          billion: "Milya"
          trillion: "Trilyon"
          quadrillion: "Kwadrilyon"

  support:
    array:
      words_connector: ", "
      two_words_connector: " ak "
      last_word_connector: ", ak "

  helpers:
    select:
      prompt: "Tanpri chwazi"
    submit:
      create: "Kreye %{model}"
      update: "Mete ajou %{model}"
      submit: "Soumèt %{model}"
    button:
      create: "Kreye"
      update: "Mete ajou"
      submit: "Soumèt"
      delete: "Efase"
      cancel: "Anile"
    label:
      create: "Kreye nouvo %{model}"
      update: "Modifye %{model}"

  errors:
