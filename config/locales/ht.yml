      half_a_minute: "mwatye minit"
      less_than_x_seconds:
        one: "mwens pase 1 segond"
        other: "mwens pase %{count} segond"
      x_seconds:
        one: "1 segond"
        other: "%{count} segond"
      less_than_x_minutes:
        one: "mwens pase yon minit"
        other: "mwens pase %{count} minit"
      x_minutes:
        one: "1 minit"
        other: "%{count} minit"
      about_x_hours:
        one: "apeprè 1 èdtan"
        other: "apeprè %{count} èdtan"
      x_days:
        one: "1 jou"
        other: "%{count} jou"
      about_x_months:
        one: "apeprè 1 mwa"
        other: "apeprè %{count} mwa"
