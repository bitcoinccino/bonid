    faq:
      title: "Questions fréquentes"
      subtitle: "Tout ce que vous devez savoir sur BonID, l’identité numérique, la sécurité et son fonctionnement en Haïti."
      items:
        q1:
          q: "Qu’est-ce que BonID ?"
          a_html: "BonID est la première identité numérique sécurisée d’Haïti. Elle vérifie les citoyens et résidents via des dossiers officiels, la biométrie faciale et des contrôles documentaires. Elle vous permet de vous vérifier instantanément partout : banques, hôpitaux, ambassades, programmes d’aide, et plus."
        q2:
          q: "Qu’est-ce que BonTouris ID et en quoi est-ce différent d’iKAT ?"
          a_html: "<strong>BonTouris ID</strong> est votre compagnon numérique privé pendant votre séjour en Haïti. Ce n’est ni un document de voyage, ni un outil d’immigration.<br><br>Il est conçu pour être utilisé <strong>après l’arrivée</strong>, pendant votre séjour, afin de vérifier votre identité rapidement et en toute sécurité auprès de <strong>la police, des hôtels, des hôpitaux, des ONG et des partenaires autorisés</strong>, sans présenter votre passeport ou des documents papier à répétition.<br><br><strong>Important :</strong><ul class=’mt-2’><li>BonTouris ID ne remplace <strong>pas</strong> le formulaire officiel <strong>iKAT arrivée/départ</strong> requis par le Gouvernement haïtien.</li><li>Tous les voyageurs doivent toujours remplir iKAT avant d’arriver en Haïti.</li><li>BonTouris ID est <strong>optionnel</strong> et destiné à être utilisé <strong>pendant le séjour</strong>.</li></ul><br>Alors qu’iKAT modernise les formalités frontalières, BonTouris ID fournit un <strong>QR code scannable</strong> permettant aux partenaires autorisés, y compris la Police Nationale d’Haïti (PNH), de vérifier en temps réel votre séjour légal, votre identité de base et vos informations de contact local.<br><br>Cela rend les interactions quotidiennes plus sûres, plus rapides et plus pratiques pour les visiteurs."
        q3:
          q: "Qu’est-ce que IDPol ?"
          a_html: "IDPol est un outil de vérification moderne créé par <strong>Verifyem</strong> spécifiquement pour la Police Nationale d’Haïti (PNH).<br><br>Il permet aux agents autorisés de vérifier les identités, de consulter le statut BonID et de confirmer l’authenticité des documents lors d’opérations officielles.<br><br>IDPol n’est <strong>pas</strong> un ancien système, et ce n’est <strong>pas une base nationale d’identité</strong>. Il fonctionne avec BonID en offrant une interface de vérification fiable et en temps réel, alimentée par l’infrastructure d’identité numérique sécurisée de BonID."
        q4:
          q: "Quel est l’objectif de BonID ?"
          a_html: "BonID fournit une identité numérique sécurisée et unifiée pour Haïti. Elle réduit la fraude, accélère l’accès aux services, protège les citoyens et permet aux institutions de vérifier l’identité instantanément via une seule API."
        q5:
          q: "De quoi ai-je besoin pour être vérifié ?"
          a_html: "Vous avez besoin :<ul class='mt-2'><li>D’un CIN ou passeport valide</li><li>D’un selfie ou scan facial</li><li>D’un document justificatif (acte de naissance, NIF, permis de conduire, facture, etc.)</li></ul>La vérification prend généralement moins de deux minutes."
        q6:
          q: "BonID remplace-t-il mon CIN ?"
          a_html: "Non. Votre CIN reste votre identité officielle. BonID est votre identité numérique qui vous permet de vous vérifier rapidement et en toute sécurité via votre téléphone ou QR code."
        q7:
          q: "Que signifient les lettres dans mon BonID ?"
          a_html: "Un BonID tel que <strong>MO-1968-M-OU-P6790H3Z</strong> est structuré ainsi :<ul class='mt-2'><li><strong>MO</strong> : initiales du prénom et du nom</li><li><strong>1968</strong> : année de naissance</li><li><strong>M/F</strong> : sexe</li><li><strong>OU</strong> : département (code 2 lettres)</li><li><strong>P/C</strong> : type de pièce</li><li><strong>6790</strong> : 4 derniers chiffres du CIN ou passeport</li><li><strong>H3Z</strong> : checksum anti-falsification</li></ul>"
        q8:
          q: "Et si je perds mon portefeuille ou mes documents ?"
          a_html: "Votre BonID reste protégé. Vous pouvez retélécharger votre QR code à tout moment, demander une réémission et vous vérifier sans transporter de documents physiques."
        q9:
          q: "Qui peut vérifier un BonID ?"
          a_html: "Uniquement des partenaires approuvés (banques, hôpitaux, ambassades, ONG, opérateurs télécoms et unités de police) disposant d’un accès API sécurisé."
        q10:
          q: "Que se passe-t-il si j’utilise des documents faux ou générés par IA ?"
          a_html: "BonID est conçu pour détecter la fraude.<br><br>Les documents sont analysés via une combinaison de <strong>détection IA</strong>, <strong>correspondance avec des dossiers officiels</strong> et <strong>revue manuelle si nécessaire</strong>.<br><br>Si des documents falsifiés sont détectés :<ul class='mt-2'><li>Votre vérification sera rejetée</li><li>Votre BonID ne sera pas émis</li><li>Des tentatives répétées peuvent entraîner des restrictions</li></ul>BonID protège les citoyens et les institutions. Des documents réels et exacts sont requis."
        q11:
          q: "Où mes données sont-elles stockées et qui peut y accéder ?"
          a_html: "Vos données sont stockées de manière sécurisée via des <strong>serveurs chiffrés et des systèmes contrôlés</strong>.<br><br>Points clés :<ul class='mt-2'><li>Documents chiffrés au repos et en transit</li><li>BonID ne vend <strong>pas</strong> vos données</li><li>Seuls les systèmes autorisés et partenaires approuvés peuvent vérifier votre BonID</li><li>Les partenaires ne reçoivent jamais les documents bruts sauf obligation légale</li></ul>BonID applique une minimisation stricte : les partenaires ne voient que le nécessaire."
        q12:
          q: "Que se passe-t-il si quelqu’un accède à mon QR code BonID ?"
          a_html: "Votre QR code BonID <strong>n’est pas une carte statique</strong>.<br><br>Même si quelqu’un le scanne :<ul class=’mt-2’><li>Il ne voit pas vos documents complets</li><li>Il ne peut pas vous usurper</li><li>Il doit être un partenaire approuvé avec accès sécurisé</li></ul><br>Protections supplémentaires :<ul class=’mt-2’><li>Journalisation des scans</li><li>Rate-limiting et détection d’abus</li><li>Révocation et réémission immédiate si nécessaire</li></ul>En cas de suspicion, vous pouvez demander un nouveau BonID et l’ancien QR sera invalidé définitivement."
        q13:
          q: "Comment voter avec BonID ?"
          a_html: "Pour voter via BonID :<ol class='mt-2'><li>Ouvrez <strong>Voter à l'Élection</strong> dans le menu</li><li>Le système vérifie que votre BonID est vérifié, que votre CIN est inscrit, et que vous n'avez pas encore voté</li><li>Cliquez sur <strong>Commencer à voter</strong> — vous ferez une vérification biométrique (votre visage) pour prouver que c'est bien vous</li><li>Remplissez votre bulletin pour chaque poste (président, sénateur, député, etc.)</li><li>Confirmez vos choix — votre vote est chiffré et inscrit dans le registre public</li><li>Vous recevez un <strong>Ballot Hash</strong> (numéro de reçu) sur l'écran de confirmation</li></ol>Le processus prend moins de 3 minutes."
        q14:
          q: "Qu'est-ce qu'un \"Ballot Hash\" ?"
          a_html: "Un <strong>Ballot Hash</strong> est un numéro spécial (comme un reçu numérique) qui prouve que <strong>votre vote a été enregistré et sera compté</strong> dans les résultats finaux.<br><br><strong>Important :</strong><ul class='mt-2'><li>Il ne révèle <strong>pas</strong> quel candidat vous avez choisi</li><li>Il prouve seulement que votre vote existe dans le registre public</li><li>C'est la seule preuve de votre vote — gardez-le en sécurité</li></ul>Conservez-le quelque part : capture d'écran, note, ou envoyez-le à vous-même sur WhatsApp."
        q15:
          q: "Où trouver mon reçu de vote (Ballot Hash) ?"
          a_html: "Juste après avoir voté, un écran apparaît disant <strong>\"Votre vote est enregistré !\"</strong>. Sur cet écran :<ul class='mt-2'><li>Vous trouverez le Ballot Hash dans une boîte bleue mise en évidence</li><li>Il y a un <strong>code QR</strong> encodant le même hash</li><li>Un gros bouton <strong>\"Copier le Ballot Hash\"</strong> le copie dans votre presse-papiers</li><li>Un bouton <strong>WhatsApp</strong> permet de l'envoyer à vous-même ou à quelqu'un de confiance</li></ul><br><strong>Conseil :</strong> Prenez une capture d'écran ET copiez-le — ainsi vous ne pouvez pas le perdre."
        q16:
          q: "Comment vérifier que mon vote a été compté ?"
          a_html: "Il y a 2 façons de vérifier :<br><br><strong>1. Avec le code QR (le plus simple) :</strong><br>Scannez le code QR qui apparaissait sur votre reçu. Cela ouvre la page de vérification avec le hash déjà rempli — appuyez simplement sur \"Vérifier\".<br><br><strong>2. Avec le Ballot Hash manuellement :</strong><ol class='mt-2'><li>Ouvrez <strong>Vérifier mon vote</strong> dans le menu</li><li>Collez votre Ballot Hash dans le champ</li><li>Appuyez sur <strong>Vérifier</strong></li></ol>Si votre vote existe, vous verrez un écran vert de confirmation. S'il n'est pas trouvé, vérifiez que vous avez bien copié le hash."
        q17:
          q: "Est-ce que quelqu'un peut voir pour qui j'ai voté ?"
          a_html: "<strong>Non.</strong> Votre vote est totalement secret.<br><br>Voici comment cela fonctionne :<ul class='mt-2'><li>Votre choix est <strong>chiffré</strong> avant d'être envoyé</li><li>Le serveur <strong>ne sait jamais</strong> pour qui vous avez voté</li><li>Seule une <strong>clé secrète de la Commission électorale</strong> peut déchiffrer les choix — et uniquement après la fermeture du scrutin, pour compter les totaux</li><li>Votre Ballot Hash prouve que votre vote existe, mais il ne révèle <strong>pas</strong> votre choix</li></ul>Le système suit les mêmes principes cryptographiques utilisés en Estonie et en Suisse pour le vote électronique vérifiable."
        q18:
          q: "Puis-je voter plusieurs fois ?"
          a_html: "<strong>Non.</strong> Chaque citoyen ne peut voter qu'une seule fois par élection.<br><br>Protections en place :<ul class='mt-2'><li>Un <strong>nullifier</strong> unique est généré par CIN — il empêche la même personne de voter deux fois</li><li>Le système vérifie cela avant chaque bulletin</li><li>Si vous essayez de voter à nouveau, vous recevez simplement le même reçu que votre vote original</li></ul>Si vous rencontrez un problème (par exemple, vous pensez que votre vote n'est pas passé), contactez le support immédiatement."
        q19:
          q: "Quand les résultats de l'élection sont-ils publiés ?"
          a_html: "Les résultats officiels sont publiés après que la Commission électorale (CEP) ait effectué la <strong>certification</strong>. Le processus inclut :<ul class='mt-2'><li>Compter tous les votes (chiffrés, puis déchiffrés avec la clé secrète du CEP)</li><li>Vérifier l'intégrité du registre public</li><li>Publier les résultats avec un badge \"Certifié\"</li></ul>Entre-temps, la page <strong>Résultats</strong> affiche un badge \"Comptage en cours\". Pour l'élection nationale d'Haïti 2026, la date de certification sera annoncée par le CEP."

