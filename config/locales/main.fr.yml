      # TODO review translations — drafts only
      rotating_subtitles:
        - "Les banques perdent des millions chaque année à cause de la fraude d’identité. BonID vérifie les clients en secondes, pas en jours."
        - "Les hôpitaux doivent confirmer rapidement l’identité des patients. BonID offre une vérification instantanée au chevet du malade."
        - "La fraude au passeport nuit à Haïti à l’étranger. BonID rattache chaque document à une identité biométrique vérifiée."
        - "Les organisations humanitaires ont besoin de savoir qui elles servent. BonID élimine les doublons et les bénéficiaires fantômes."
        - "Les barrages de police s’appuient sur des papiers que n’importe qui peut falsifier. BonID donne aux agents une vérification en temps réel."
        - "Les ambassades traitent des milliers de demandes de visa. BonID confirme l’identité avant même le début de l’entretien."
        - "Les opérateurs télécoms perdent des revenus à cause de la fraude SIM. BonID lie chaque enregistrement SIM à une personne vérifiée."
        - "Les institutions de microfinance n’arrivent pas à vérifier les emprunteurs en zone rurale. BonID fonctionne partout où il y a du signal."
        - "Les élections exigent des listes électorales fiables. BonID relie chaque vote à un citoyen vérifié par biométrie."
        - "Les sinistres d’assurance sont déposés sous des identités volées. BonID arrête la fraude avant le paiement."

    matrix:
      title: "Sécurisez votre identité en 3 étapes"
      subtitle_html: "Les papiers peuvent être falsifiés et les photos remplacées. BonID relie votre identité à votre vrai visage, vérifié en direct.<br>Une seule identité numérique vérifiée, utilisable chez les partenaires BonID."
      steps:
        step1:
          title: "1. Envoyez vos documents"
          desc_html: "Téléversez les deux côtés de votre CIN, ou votre passeport, et un justificatif de domicile. Prenez ensuite un selfie en direct. L’application vous guide étape par étape."
        step2:
          title: "2. IA + Vérification humaine"
          desc_html: "L’IA vérifie que vous êtes une vraie personne, compare votre visage à la photo de votre pièce d’identité et bloque les comptes en double. Notre équipe examine ensuite chaque demande.<br><strong>Vérification du visage en quelques secondes.</strong>"
        step3:
          title: "3. Recevez votre QR code"
          desc: "Une fois approuvé, vous recevez votre BonID et son QR code. Les partenaires le scannent pour confirmer que c’est bien vous. Fini les photocopies."
      cta_line_html: "<strong>Soyez parmi les premiers à sécuriser votre identité numérique</strong>"
      cta_button: "Rejoindre"

