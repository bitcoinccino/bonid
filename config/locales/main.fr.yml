    faq:
      title: "Questions fréquentes"
      subtitle: "L’essentiel sur BonID, l’identité numérique et la sécurité en Haïti."
      items:
        q1:
          q: "Qu’est-ce que BonID ?"
          a_html: "BonID est la première identité numérique sécurisée d’Haïti. Elle vérifie les citoyens et résidents à partir de votre CIN, d’un scan facial en direct comparé à la photo de votre pièce, et d’un examen de vos documents par notre équipe.<br><br>Une fois vérifié, vous pouvez prouver votre identité instantanément auprès :<ul class='mt-2'><li>Des banques et institutions financières</li><li>Des hôpitaux et cliniques</li><li>Des ambassades et consulats</li><li>Des programmes d’aide et ONG</li><li>Des opérateurs télécoms, et plus</li></ul>Vos informations ne sont partagées avec une organisation que si vous l’approuvez."
        q2:
          q: "Qu’est-ce que BonTouris ID et en quoi est-ce différent d’iKAT ?"
          a_html: "<strong>BonTouris ID</strong> est votre compagnon numérique privé pendant votre séjour en Haïti. Ce n’est ni un document de voyage, ni un outil d’immigration.<br><br>Il est conçu pour être utilisé <strong>après l’arrivée</strong>, pendant votre séjour, afin de vérifier votre identité rapidement et en toute sécurité auprès de <strong>la police, des hôtels, des hôpitaux, des ONG et des partenaires autorisés</strong>, sans présenter votre passeport ou des documents papier à répétition.<br><br><strong>Important :</strong><ul class=’mt-2’><li>BonTouris ID ne remplace <strong>pas</strong> le formulaire officiel <strong>iKAT arrivée/départ</strong> requis par le Gouvernement haïtien.</li><li>Tous les voyageurs doivent toujours remplir iKAT avant d’arriver en Haïti.</li><li>BonTouris ID est <strong>optionnel</strong> et destiné à être utilisé <strong>pendant le séjour</strong>.</li></ul><br>Alors qu’iKAT modernise les formalités frontalières, BonTouris ID fournit un <strong>QR code scannable</strong> permettant aux partenaires autorisés, y compris la Police Nationale d’Haïti (PNH), de vérifier en temps réel votre séjour légal, votre identité de base et vos informations de contact local.<br><br>Cela rend les interactions quotidiennes plus sûres, plus rapides et plus pratiques pour les visiteurs."
        q3:
          q: "Qu’est-ce que IDPol ?"
          a_html: "IDPol est un outil de vérification moderne créé par <strong>Verifyem</strong> spécifiquement pour la Police Nationale d’Haïti (PNH).<br><br>Il permet aux agents autorisés de vérifier les identités, de consulter le statut BonID et de confirmer l’authenticité des documents lors d’opérations officielles.<br><br>IDPol n’est <strong>pas</strong> un ancien système, et ce n’est <strong>pas une base nationale d’identité</strong>. Il fonctionne avec BonID en offrant une interface de vérification fiable et en temps réel, alimentée par l’infrastructure d’identité numérique sécurisée de BonID."
        q4:
          q: "Quel est l’objectif de BonID ?"
          a_html: "BonID fournit une identité numérique sécurisée et unifiée pour Haïti. Elle réduit la fraude, accélère l’accès aux services, protège les citoyens et permet aux institutions de vérifier l’identité instantanément via une seule API."
        q5:
          q: "De quoi ai-je besoin pour être vérifié ?"
          a_html: "Vous avez besoin :<ul class='mt-2'><li><strong>De votre CIN</strong> (un passeport valide est aussi accepté)</li><li><strong>D’un scan facial en direct</strong> (selfie) pris lors de l’inscription</li><li><strong>De votre signature</strong></li><li><strong>D’un justificatif de domicile</strong> : facture de service, bail, relevé bancaire, reçu de transfert d’argent, ou facture Digicel/Natcom</li></ul>Un acte de naissance n’est <strong>pas</strong> nécessaire.<br><br>La soumission prend quelques minutes. Notre équipe examine ensuite vos documents et vous recevez un e-mail dès que votre BonID est approuvé."
        q6:
          q: "BonID remplace-t-il mon CIN ?"
          a_html: "Non. Votre CIN reste votre identité officielle. BonID est votre identité numérique qui vous permet de vous vérifier rapidement et en toute sécurité via votre téléphone ou QR code."
        q7:
          q: "Que signifient les lettres dans mon BonID ?"
          a_html: "Un BonID tel que <strong>MO-1968-M-OU-P6790-H3Z</strong> est structuré ainsi :<ul class='mt-2'><li><strong>MO</strong> : initiales du prénom et du nom</li><li><strong>1968</strong> : année de naissance</li><li><strong>M/F</strong> : sexe</li><li><strong>OU</strong> : département (code 2 lettres)</li><li><strong>P6790</strong> : type de pièce et numéro de référence de votre pièce</li><li><strong>H3Z</strong> : checksum anti-falsification</li></ul>"
        q8:
          q: "Et si je perds mon portefeuille ou mes documents ?"
          a_html: "Votre BonID reste protégé. Vous pouvez retélécharger votre QR code à tout moment, demander une réémission et vous vérifier sans transporter de documents physiques."
        q9:
          q: "Qui peut vérifier un BonID ?"
          a_html: "Uniquement des partenaires approuvés disposant d’un accès sécurisé : banques, hôpitaux, ambassades, ONG, opérateurs télécoms et unités de police (PNH).<br><br><strong>Vous gardez le contrôle :</strong><ul class='mt-2'><li>Un partenaire ne voit vos informations qu’après votre approbation sur l’écran de consentement BonID</li><li>Vous choisissez ce que vous partagez, par exemple votre nom et votre photo mais pas votre adresse</li><li>Vous pouvez retirer l’accès d’un partenaire à tout moment depuis votre compte</li></ul>"
        q10:
          q: "Que se passe-t-il si j’utilise de faux documents ?"
          a_html: "BonID est conçu pour détecter la fraude.<br><br>Chaque demande passe par une <strong>vérification du visage en direct</strong>, une <strong>comparaison</strong> entre votre selfie et la photo de votre pièce, et un <strong>examen manuel</strong> de vos documents par notre équipe.<br><br>Si des documents falsifiés sont détectés :<ul class='mt-2'><li>Votre vérification sera rejetée</li><li>Votre BonID ne sera pas émis</li><li>Des tentatives répétées peuvent entraîner des restrictions</li></ul>BonID protège les citoyens et les institutions. Des documents réels et exacts sont requis."
        q11:
          q: "Où mes données sont-elles stockées et qui peut y accéder ?"
          a_html: "Vos données sont stockées de manière sécurisée via des <strong>serveurs chiffrés et des systèmes contrôlés</strong>.<br><br>Points clés :<ul class='mt-2'><li>Documents chiffrés au repos et en transit</li><li>BonID ne vend <strong>pas</strong> vos données</li><li>Seuls les systèmes autorisés et partenaires approuvés peuvent vérifier votre BonID</li><li>Les partenaires ne reçoivent jamais les documents bruts sauf obligation légale</li></ul>BonID applique une minimisation stricte : les partenaires ne voient que le nécessaire."
        q12:
          q: "Que se passe-t-il si quelqu’un accède à mon QR code BonID ?"
          a_html: "Votre QR code BonID <strong>n’est pas une carte statique</strong>.<br><br>Même si quelqu’un le scanne :<ul class='mt-2'><li>Il ne voit pas vos documents complets</li><li>Cela ne lui permet ni de se connecter à votre compte ni d’approuver un partage à votre place</li><li>Il doit être un partenaire approuvé avec accès sécurisé</li></ul>Protections supplémentaires :<ul class='mt-2'><li>Journalisation des scans</li><li>Limitation des tentatives et détection des abus</li><li>Un e-mail d’alerte à chaque connexion depuis un nouvel appareil, avec un lien pour vous déconnecter partout</li></ul>En cas de doute, générez un nouveau QR code depuis votre tableau de bord : l’ancien cesse de fonctionner."
        q13:
          q: "Comment m’inscrire pour voter avec BonID ?"
          a_html: "Ouvrez <strong>Mes élections</strong> dans le menu, choisissez comment vous voterez, puis appuyez sur <strong>Confirmer l’inscription</strong>.<br><br>BonID utilise votre identité déjà vérifiée : vous n’avez aucun document à envoyer de nouveau.<br><br>Vous pouvez aussi vous inscrire en personne dans un bureau BonID."
        q14:
          q: "Qui peut s’inscrire ?"
          a_html: "Pour vous inscrire, il faut :<ul class='mt-2'><li>Avoir <strong>18 ans ou plus</strong></li><li>Avoir un <strong>BonID vérifié</strong></li><li>Avoir une <strong>pièce d’identité vérifiée</strong> dans votre profil</li></ul>Si une condition manque, la page <strong>Mes élections</strong> vous dit quoi faire."
        q15:
          q: "Qu’est-ce que mon numéro d’électeur ?"
          a_html: "C’est le numéro qui confirme votre inscription, par exemple <strong>BVT-2026-K9F2-HQXR</strong>.<br><br>Il apparaît sur <strong>Mes élections</strong> et sur votre reçu. Vous pouvez le copier en un geste. Gardez-le : il vous sera utile le jour du vote."
        q16:
          q: "Comment savoir où voter ?"
          a_html: "La section <strong>Où et quand voter</strong> de la page <strong>Mes élections</strong> indique votre centre de vote, votre numéro de bureau (BV), les heures d’ouverture et l’adresse, avec un lien vers la carte.<br><br>Si elle affiche <strong>Pas encore attribué</strong>, le CEP vous attribuera bientôt un bureau de vote."
        q17:
          q: "Comment prouver que je suis inscrit ?"
          a_html: "Téléchargez ou imprimez votre <strong>reçu d’inscription</strong> depuis <strong>Mes élections</strong>.<br><br>Le reçu contient un <strong>code QR</strong>. N’importe qui peut le scanner avec un téléphone pour confirmer qu’il est authentique : un agent, votre famille ou un observateur. Le bouton <strong>Vérifier maintenant</strong> fait la même chose.<br><br>Conseil : enregistrez le reçu sur votre téléphone avant le jour du vote, au cas où le réseau ne marcherait pas."
        q18:
          q: "Puis-je voter en ligne ?"
          a_html: "Pas pour le moment. Pour cette étape, BonID sert à <strong>vous inscrire</strong> et à vous indiquer <strong>où voter</strong>.<br><br>Le jour de l’élection, rendez-vous à votre bureau de vote avec votre pièce d’identité."
        q19:
          q: "Que se passe-t-il si les dates de l’élection changent ?"
          a_html: "Les dates sont fixées par le <strong>CEP</strong>. Si elles changent, la page <strong>Mes élections</strong> affiche la nouvelle date dès qu’elle est annoncée.<br><br>Votre inscription reste enregistrée : vous n’avez rien à refaire."

