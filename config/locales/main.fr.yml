      uses:
        banking:
          problem: "Ouvrir un compte ou retirer un transfert demande des copies de CIN, un justificatif d’adresse et des heures d’attente dans des zones à risque."
          solution: "Vérifiez votre identité une fois, depuis chez vous. La banque reçoit votre profil confirmé, et vous vous déplacez moins en agence."
        mobile_wallet:
          problem: "Pour envoyer de l’argent, retirer ou utiliser un portefeuille mobile, on vous redemande votre pièce, les photos floues sont refusées, et l’argent arrive en retard quand vous en avez le plus besoin."
          solution: "Vérifié une fois. Un scan confirme votre identité, avec votre accord, pour des envois et des retraits plus rapides."
        healthcare:
          problem: "Votre dossier tient sur un carnet en papier. Perdu, ou dans un autre hôpital, tout est à refaire."
          solution: "L’hôpital vous identifie en un scan, même sans papiers sur vous."
        law_enforcement:
          problem: "Porter ses papiers originaux, c’est risquer de se les faire voler. Les laisser à la maison, c’est risquer d’être retenu au contrôle. Et les faux papiers ralentissent le travail de la police."
          solution: "Un scan suffit pour que l’agent confirme votre vraie identité sur place. Vous passez le contrôle vite et en sécurité, avec moins de risque de perdre vos papiers."
        cep:
          problem: "L’insécurité rend dangereux le trajet vers les centres d’inscription, et les listes électorales sont pleines de doublons et de dossiers manquants."
          solution: "Inscrivez-vous depuis votre téléphone. Une vérification du visage prouve que vous êtes une personne réelle, inscrite une seule fois, sans prendre la route."
        dgi:
          problem: "Pour un NIF ou une démarche fiscale, il faut prouver qui vous êtes à chaque guichet, copies à l’appui."
          solution: "La DGI reçoit votre identité vérifiée, avec votre accord."
        oni:
          problem: "Beaucoup ont perdu leur CIN en fuyant leur quartier. La remplacer demande des visites dans des bureaux débordés."
          solution: "Votre identité vérifiée reste sur votre téléphone, même si la carte est perdue."
        embassy:
          problem: "Visas, légalisations et services consulaires demandent des voyages coûteux, des papiers légalisés et des mois d’attente."
          solution: "Partagez une preuve signée de votre identité en ligne, avec votre accord, pour moins de papiers dans vos démarches consulaires et de visa."
        government:
          problem: "Pour un passeport ou un document officiel, les files sont longues et des intermédiaires font payer les rendez-vous."
          solution: "Votre identité est déjà vérifiée. Le bureau la confirme directement, sans intermédiaire."
        telecommunications:
          problem: "Des puces enregistrées sous de faux noms servent aux arnaques et aux enlèvements."
          solution: "Chaque ligne est liée à une personne vérifiée."
        insurance:
          problem: "La fraude à l’identité fait monter les prix, et vérifier un sinistre peut prendre des semaines."
          solution: "L’assureur sait tout de suite à qui il a affaire."
        education:
          problem: "Faux diplômes et dossiers perdus pendant les déplacements bloquent les inscriptions."
          solution: "L’école confirme l’identité de l’élève en un scan."
        retail:
          problem: "Livraisons et ventes à crédit sont risquées quand on ne peut pas vérifier le client."
          solution: "Le commerçant vérifie le client en un scan, avec son accord."
        hospitality:
          problem: "À l’hôtel, on laisse sa pièce à la réception ou on la fait photocopier, sans savoir où elle finit."
          solution: "Vous êtes vérifié sans laisser vos papiers."
        real_estate:
          problem: "Un même terrain est parfois vendu à plusieurs personnes, par de faux vendeurs."
          solution: "Vous savez que le vendeur est bien la personne qu’il dit être."
        ngos:
          problem: "Pendant une crise, des familles sont inscrites deux fois, d’autres oubliées, et l’aide se perd."
          solution: "Chaque personne est vérifiée une fois par son visage, et l’aide va à la bonne personne."
        legal:
          problem: "Fausses procurations et usurpations d’identité devant notaire coûtent des terrains et des héritages."
          solution: "Le notaire confirme que le signataire est bien la bonne personne."
        cryptocurrency:
          problem: "Les applis crypto et de transfert bloquent souvent les comptes et redemandent vos pièces, souvent refusées quand elles sont haïtiennes. Débloquer un compte peut prendre des semaines."
          solution: "Passez les contrôles en quelques secondes, sans renvoyer de photos de votre pièce."
        default:
          problem: "Faux papiers, copies, files : prouver qui on est coûte du temps et de l’argent."
          solution: "Vous êtes vérifié une fois, puis vous le prouvez en un scan, avec votre accord."
        immigration:
          problem: "Pour un passeport, il faut souvent payer un intermédiaire (raketè) pour obtenir un rendez-vous, attendre des mois dans la foule et risquer de perdre ses papiers."
          solution: "Plus besoin d’intermédiaire. Votre identité est vérifiée avant votre arrivée, et l’Immigration confirme votre dossier directement."
