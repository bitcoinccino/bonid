# English copy for citizen emails that aren't in main.en.yml.
en:
  mailers:
    waitlist_confirmation:
      subject: "You're on the list!"
      heading: "You're on the list!"
      greeting: "Hi %{name},"
      intro_commune: "Thanks for joining the BonID waitlist in %{commune}. We'll email you as soon as BonID is available there."
      intro: "Thanks for joining the BonID waitlist. We'll email you as soon as BonID is available to you."
      count: "%{count} people already signed up in %{commune}"
      mission: "For the first time, you're in control of your information: you see where it was used, and you share only what you want to share."
      share_title: "Share your link so your family and friends can sign up too:"
      whatsapp: "Share on WhatsApp"
      share_text: "I just joined the BonID waitlist, Haiti's first secure digital identity. Sign up too: %{url}"
      signoff: "The BonID Team"
    waitlist_common:
      greeting: "Hi %{name},"
      create: "Create my account"
      what_is_title: "What is BonID?"
      what_is_body: "Haiti's first secure digital identity. You're in full control of your information: you see where it was used, and you share only what you want to share."
      help: "Need help? Write to us at"
      signoff: "The BonID Team"

    waitlist_launch:
      subject: "BonID is live in %{commune}!"
      heading: "BonID is live in %{commune}!"
      body: "Great news! BonID has officially launched in %{commune}. You were on the waitlist: you can now create your account."
      ready: "Your account is ready to create"

    waitlist_invitation:
      subject: "You're invited to BonID! Create your account"
      heading: "BonID is ready for you!"
      body: "You joined the BonID waitlist, and we're ready for you. Click the button to create your account."
      code: "Your invite code:"
    otp_login:
      subject: "BonID: Your sign-in code"
      heading: "Sign in to BonID"
      lead_html: "Use this code to sign in securely. It expires in <strong>10 minutes</strong> and can only be used once."
      expiry: "This code expires in 10 minutes and can only be used once."
      code_label: "One-time code"
      greeting: "Hello %{name},"
      body: "Enter the code above to finish signing in to your BonID account."
      not_you: "If you didn't ask for this code, you can ignore this email."
      help: "Need help? Write to"
      signoff: "The BonID Team"

    citizen_common:
      greeting: "Hi %{name},"
      greeting_html: "Hi <strong>%{name}</strong>,"
      status: "Status:"
      signoff: "The BonID Team"
      support_html: "Need help? Write to us at <a href=\"mailto:support@verifyem.ht\">support@verifyem.ht</a>."
    identity_submission:
      received:
        subject: "BonID: We received your verification request"
        heading: "Verification submitted"
        status: "Pending review"
        status_note: "Our verification team is reviewing your submission."
        body: "Thank you for submitting your identity verification. Our reviewers are checking your documents to confirm your BonID."
        button: "View my submission"
        closing: "Once approved, you'll get your BonID QR code, which you can use with trusted institutions such as banks, embassies, and the police."
      approved:
        subject: "BonID: Your verification is approved!"
        heading: "BonID approved"
        status: "Approved"
        status_note: "Your BonID is now active and ready to use."
        body: "Congratulations. Your BonID verification has been approved. You can now use your BonID QR code to prove who you are with trusted institutions such as banks, embassies, and the police."
        button: "View my BonID"
        closing: "Thank you for completing your identity verification with BonID."
      rejected:
        subject: "BonID: Your submission was not approved"
        heading: "BonID not approved"
        status: "Not approved"
        status_note: "Your submission did not meet the verification requirements."
        body: "Unfortunately, your BonID verification could not be approved this time. You can see the reason and send your documents again."
        button: "Review my submission"
      reset_requested:
        subject: "BonID: Reset request received"
        heading: "Reset request received"
        status: "Pending review"
        status_note: "Your request to reset your BonID is being reviewed."
        body: "We received your BonID reset request. Our verification team will check the details you provided before issuing a new BonID."
        button: "View my requests"
        closing: "We'll email you again once your request is approved or not approved."
      reset_approved:
        subject: "BonID: Reset approved"
        heading: "Reset approved"
        status: "Approved"
        status_note: "A new BonID has been issued to you."
        body: "Your BonID reset request has been approved. Your previous QR code no longer works, and a new one has been created for your account."
        button: "View my new BonID"
        closing: "Please check that all your information is correct, and keep your BonID safe."
      reset_rejected:
        subject: "BonID: Reset not approved"
        heading: "Reset not approved"
        status: "Not approved"
        status_note: "Your BonID reset request was not approved."
        body: "We reviewed your BonID reset request, but it did not meet the requirements. Please make sure your documents and information are valid before sending it again."
        button: "Send a new request"
    qr_scan:
      subject: "BonID: Your BonID was checked on %{date}"
      heading: "Your BonID was checked"
      body: "Someone just checked your BonID to confirm who you are."
      who: "Who:"
      when: "When:"
      where: "Where:"
      where_value: "about %{place}"
      who_police: "%{name} (police)"
      police_default: "A police officer"
      who_camera: "Someone using a phone camera"
      not_you_title: "Wasn't you?"
      not_you: "Someone may have a photo of your QR code. Contact support@verifyem.ht right away."
      button: "See your activity"
      date_format: "%b %-d, %Y"
      time_format: "%b %-d, %Y at %-I:%M %p"
    name_change:
      subject: "BonID: Your name change is approved. Please verify again"
      heading: "Name change approved"
      body_html: "Your request to change your name from <strong>%{old}</strong> to <strong>%{new}</strong> has been approved."
      required: "Verification required again"
      steps_intro: "For the new name to take effect, you need to:"
      step1: "Upload your new CIN or passport showing your new name"
      step2: "Complete the live face check"
      step3: "Submit a new BonID request"
      button: "Go to my dashboard"
      not_you: "If you didn't ask for this change, contact support@verifyem.ht right away."
