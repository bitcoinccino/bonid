# Citizen emails sent in the citizen's portal language (Kreyòl).
# English lives in main.en.yml (mailers.access.*); the layout falls back
# to its English defaults.
ht:
  mailers:
    layout:
      bonid_tagline_1: "Yon idantite dijital prive, se pa yon ID gouvènman."
      bonid_tagline_2: "Verifye yon fwa, itilize l toupatou."
      rights: "Tout dwa rezève"
    access:
      badge: "Enfòmasyon ou"
      greeting: "Bonjou %{name},"
      manage_button: "Wè ki moun ki ka wè enfòmasyon ou"
      not_you_title: "Se pa t ou?"
      granted:
        subject: "BonID: %{partner_name} ka wè enfòmasyon ou kounye a"
        heading: "%{partner_name} ka wè enfòmasyon ou kounye a"
        body: "Ou pèmèt %{partner_name} wè kèk enfòmasyon BonID ou."
        what_they_see: "Sa %{partner_name} ka wè"
        ends_on: "Aksè sa a fini %{date}. Ou ka retire l nenpòt ki lè."
        not_you_body: "Retire aksè %{partner_name} kounye a epi kontakte support@bonid.ht."
      removed:
        subject: "BonID: %{partner_name} pa ka wè enfòmasyon ou ankò"
        heading: "%{partner_name} pa ka wè enfòmasyon ou ankò"
        body: "Ou retire aksè %{partner_name} %{date}."
        point_stop: "%{partner_name} pa ka wè enfòmasyon ou ankò."
        point_delete: "Yo dwe efase enfòmasyon yo genyen deja nan 30 jou."
        point_again: "Ou ka bay aksè ankò pita si w chanje lide."
        not_you_body: "Gen moun ki ka ap itilize kont ou. Kontakte support@bonid.ht touswit."
