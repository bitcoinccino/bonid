# Citizen emails sent in the citizen's portal language (Kreyòl).
# English lives in main.en.yml (mailers.access.*); the layout falls back
# to its English defaults.
ht:
  mailers:
    layout:
      bonid_tagline_1: "Yon idantite dijital prive, se pa yon ID gouvènman."
      bonid_tagline_2: "Verifye yon fwa, itilize l toupatou."
      rights: "Tout dwa rezève"
    waitlist_confirmation:
      subject: "Ou sou lis la!"
      heading: "Ou sou lis la!"
      greeting: "Bonjou %{name},"
      intro_commune: "Mesi paske ou enskri pou BonID nan %{commune}. N ap ekri w kou BonID disponib la."
      intro: "Mesi paske ou enskri pou BonID. N ap ekri w kou BonID disponib pou ou."
      count: "%{count} moun deja enskri nan %{commune}"
      mission: "Pou premye fwa, ou gen kontwòl sou enfòmasyon ou: ou wè ki kote yo itilize l, epi ou pataje sèlman sa ou vle pataje."
      share_title: "Pataje lyen ou pou fanmi ak zanmi ou enskri tou:"
      whatsapp: "Pataje sou WhatsApp"
      share_text: "Mwen fèk enskri pou BonID, premye idantite dijital sekirize Ayiti. Enskri tou: %{url}"
      signoff: "Ekip BonID"
    waitlist_common:
      greeting: "Bonjou %{name},"
      create: "Kreye kont mwen"
      what_is_title: "Kisa BonID ye?"
      what_is_body: "Premye idantite dijital sekirize Ayiti. Ou gen kontwòl total sou enfòmasyon ou: ou wè ki kote yo itilize l, epi ou pataje sèlman sa ou vle pataje."
      help: "Ou bezwen èd? Ekri nou nan"
      signoff: "Ekip BonID"

    waitlist_launch:
      subject: "BonID disponib nan %{commune}!"
      heading: "BonID disponib nan %{commune}!"
      body: "Bon nouvèl! BonID lanse ofisyèlman nan %{commune}. Ou te sou lis datant lan: kounye a ou ka kreye kont ou."
      ready: "Kont ou pare pou kreye"

    waitlist_invitation:
      subject: "Ou envite sou BonID! Kreye kont ou kounye a"
      heading: "BonID pare pou ou!"
      body: "Ou te enskri sou lis datant BonID, epi kounye a nou pare pou ou. Klike bouton an pou kreye kont ou."
      code: "Kòd envitasyon ou:"
    otp_login:
      subject: "BonID: Kòd koneksyon ou"
      heading: "Konekte sou BonID"
      lead_html: "Sèvi ak kòd sa a pou konekte an sekirite. Li ekspire nan <strong>10 minit</strong> epi li sèvi yon sèl fwa."
      expiry: "Kòd sa a ekspire nan 10 minit epi li sèvi yon sèl fwa."
      code_label: "Kòd yon sèl fwa"
      greeting: "Bonjou %{name},"
      body: "Antre kòd ki anwo a pou w fin konekte sou kont BonID ou."
      not_you: "Si se pa ou ki mande kòd sa a, ou ka inyore imel sa a."
      help: "Ou bezwen èd? Ekri"
      signoff: "Ekip BonID"
    access:
      badge: "Enfòmasyon ou"
      greeting: "Bonjou %{name},"
      manage_button: "Wè ki moun ki ka wè enfòmasyon ou"
      not_you_title: "Se pa t ou?"
      granted:
        subject: "BonID: %{partner_name} ka wè enfòmasyon ou kounye a"
        heading: "%{partner_name} ka wè enfòmasyon ou kounye a"
        body: "Ou pèmèt %{partner_name} wè kèk enfòmasyon BonID ou."
        what_they_see: "Sa %{partner_name} ka wè"
        ends_on: "Aksè sa a fini %{date}. Ou ka retire l nenpòt ki lè."
        not_you_body: "Retire aksè %{partner_name} kounye a epi kontakte support@verifyem.ht."
      removed:
        subject: "BonID: %{partner_name} pa ka wè enfòmasyon ou ankò"
        heading: "%{partner_name} pa ka wè enfòmasyon ou ankò"
        body: "Ou retire aksè %{partner_name} %{date}."
        point_stop: "%{partner_name} pa ka wè enfòmasyon ou ankò."
        point_delete: "Yo dwe efase enfòmasyon yo genyen deja nan 30 jou."
        point_again: "Ou ka bay aksè ankò pita si w chanje lide."
        not_you_body: "Gen moun ki ka ap itilize kont ou. Kontakte support@verifyem.ht touswit."

    citizen_common:
      greeting: "Bonjou %{name},"
      greeting_html: "Bonjou <strong>%{name}</strong>,"
      status: "Sitiyasyon:"
      signoff: "Ekip BonID"
      support_html: "Ou bezwen èd? Ekri nou nan <a href=\"mailto:support@verifyem.ht\">support@verifyem.ht</a>."
    identity_submission:
      received:
        subject: "BonID: Nou resevwa soumisyon verifikasyon ou"
        heading: "Verifikasyon voye"
        status: "Ap revize"
        status_note: "Ekip verifikasyon nou an ap revize soumisyon ou."
        body: "Mèsi paske ou voye verifikasyon idantite ou. Revizè nou yo ap tcheke dokiman ou yo pou konfime BonID ou."
        button: "Gade soumisyon mwen"
        closing: "Lè yo apwouve l, w ap resevwa QR kòd BonID ou, pou w itilize ak enstitisyon ou ka fè konfyans tankou bank, anbasad ak lapolis."
      approved:
        subject: "BonID: Verifikasyon ou apwouve!"
        heading: "BonID apwouve"
        status: "Apwouve"
        status_note: "BonID ou aktif kounye a, li pare pou w itilize l."
        body: "Felisitasyon. Verifikasyon BonID ou apwouve. Kounye a ou ka itilize QR kòd BonID ou pou pwouve kiyès ou ye ak enstitisyon ou ka fè konfyans tankou bank, anbasad ak lapolis."
        button: "Gade BonID mwen"
        closing: "Mèsi paske ou fè verifikasyon idantite ou ak BonID."
      rejected:
        subject: "BonID: Soumisyon ou pa apwouve"
        heading: "BonID pa apwouve"
        status: "Pa apwouve"
        status_note: "Soumisyon ou pa reponn kondisyon verifikasyon yo."
        body: "Malerezman, nou pa t ka apwouve verifikasyon BonID ou fwa sa a. Ou ka gade rezon an epi voye dokiman ou yo ankò."
        button: "Gade soumisyon mwen"
      reset_requested:
        subject: "BonID: Demann reyinisyalizasyon resevwa"
        heading: "Demann reyinisyalizasyon resevwa"
        status: "Ap revize"
        status_note: "Y ap revize demann ou pou reyinisyalize BonID ou."
        body: "Nou resevwa demann ou pou reyinisyalize BonID ou. Ekip verifikasyon nou an ap tcheke enfòmasyon ou bay yo anvan li bay yon nouvo BonID."
        button: "Gade demann mwen yo"
        closing: "N ap voye yon lòt imèl ba ou lè demann ou apwouve oswa li pa apwouve."
      reset_approved:
        subject: "BonID: Reyinisyalizasyon apwouve"
        heading: "Reyinisyalizasyon apwouve"
        status: "Apwouve"
        status_note: "Yo ba ou yon nouvo BonID."
        body: "Demann reyinisyalizasyon BonID ou apwouve. Ansyen QR kòd ou a pa mache ankò, epi yo kreye yon nouvo pou kont ou."
        button: "Gade nouvo BonID mwen"
        closing: "Tanpri tcheke tout enfòmasyon ou yo kòrèk, epi kenbe BonID ou an sekirite."
      reset_rejected:
        subject: "BonID: Reyinisyalizasyon pa apwouve"
        heading: "Reyinisyalizasyon pa apwouve"
        status: "Pa apwouve"
        status_note: "Demann reyinisyalizasyon BonID ou pa apwouve."
        body: "Nou revize demann reyinisyalizasyon ou, men li pa reponn kondisyon yo. Tanpri asire w dokiman ak enfòmasyon ou yo valab anvan ou voye l ankò."
        button: "Voye yon nouvo demann"
    qr_scan:
      subject: "BonID: Yo verifye BonID ou %{date}"
      heading: "Yo verifye BonID ou"
      body: "Yon moun fèk verifye BonID ou pou konfime kiyès ou ye."
      who: "Kiyès:"
      when: "Kilè:"
      where: "Ki kote:"
      where_value: "bò %{place}"
      who_police: "%{name} (lapolis)"
      police_default: "Yon polisye"
      who_camera: "Yon moun ki itilize kamera yon telefòn"
      not_you_title: "Se pa t ou?"
      not_you: "Yon moun ka gen yon foto QR kòd ou. Kontakte support@verifyem.ht touswit."
      button: "Gade aktivite mwen"
      date_format: "%-d %b %Y"
      time_format: "%-d %b %Y a %H:%M"
    name_change:
      subject: "BonID: Chanjman non ou apwouve. Ou dwe verifye ankò"
      heading: "Chanjman non apwouve"
      body_html: "Demann ou pou chanje non ou soti <strong>%{old}</strong> pou ale <strong>%{new}</strong> apwouve."
      required: "Ou dwe verifye ankò"
      steps_intro: "Pou nouvo non an pran efè, ou dwe:"
      step1: "Telechaje nouvo CIN oswa paspò ou ki gen nouvo non an"
      step2: "Fè verifikasyon figi an dirèk"
      step3: "Voye yon nouvo demann BonID"
      button: "Ale nan tablo mwen"
      not_you: "Si se pa ou ki mande chanjman sa a, kontakte support@verifyem.ht touswit."
