    faq:
      title: "Kesyon yo poze souvan"
      subtitle: "Tout sa ou bezwen konnen sou BonID, idantite dijital, sekirite, ak kijan li mache ann Ayiti."
      items:
        q1:
          q: "Kisa BonID ye?"
          a_html: "BonID se premye idantite dijital ki an sekirite ann Ayiti. Li verifye sitwayen ak rezidan yo ak CIN ou, yon eskan figi an dirèk yo konpare ak foto ki sou kat idantite ou, epi ekip nou an revize dokiman ou yo.<br><br>Lè ou verifye, ou ka pwouve kiyès ou ye rapid nan:<ul class='mt-2'><li>Bank ak enstitisyon finansye</li><li>Lopital ak klinik</li><li>Anbasad ak konsila</li><li>Pwogram èd ak ONG</li><li>Konpayi telefòn, elatriye</li></ul>Enfòmasyon ou pataje ak yon òganizasyon sèlman lè ou dakò."
        q2:
          q: "Kisa BonTouris ID ye, e kijan li diferan ak iKAT?"
          a_html: "<strong>BonTouris ID</strong> se yon idantite dijital prive pou ede w pandan ou an Ayiti. Li pa yon dokiman vwayaj, li pa imigrasyon.<br><br>Li fèt pou itilize <strong>apre ou rive</strong>, pandan sejou ou, pou ede w verifye idantite w vit epi an sekirite ak <strong>polis, otèl, lopital, ONG, ak patnè otorize</strong>, san ou pa bezwen montre paspò w oswa papye yo chak fwa.<br><br><strong>Enpòtan:</strong><ul class=’mt-2’><li>BonTouris ID <strong>pa</strong> ranplase fòm ofisyèl <strong>iKAT</strong> (antre/sòti) Gouvènman Ayiti mande.</li><li>Tout vwayajè dwe ranpli iKAT anvan yo rive.</li><li>BonTouris ID se <strong>opsyonèl</strong> e li fèt pou itilize <strong>pandan sejou ou</strong>.</li></ul><br>Pandan iKAT modènize fòmalite fwontyè yo, BonTouris ID bay yon <strong>kòd QR</strong> patnè otorize yo ka eskane, enkli Polis Nasyonal d’Ayiti (PNH), pou verifye sejou legal ou, idantite debaz ou, ak kontak lokal ou an tan reyèl.<br><br>Sa fè entèraksyon chak jou yo pi an sekirite, pi rapid, e pi pratik pou vizitè yo."
        q3:
          q: "Kisa IDPol ye?"
          a_html: "IDPol se yon zouti verifikasyon modèn <strong>Verifyem</strong> devlope espesyalman pou Polis Nasyonal d’Ayiti (PNH).<br><br>Li pèmèt ajan PNH ki otorize yo verifye idantite an sekirite, tcheke estati BonID, epi konfime otantisite dokiman pandan operasyon ofisyèl yo.<br><br>IDPol <strong>pa</strong> yon ansyen sistèm, e li <strong>pa yon bazdone nasyonal idantite</strong>. Li travay ansanm ak BonID pou bay lapolis yon entèfas verifikasyon ki fyab an tan reyèl."
        q4:
          q: "Ki objektif BonID?"
          a_html: "BonID bay yon idantite dijital inifye epi an sekirite pou Ayiti. Li diminye fwod, akselere aksè a sèvis, pwoteje sitwayen yo, epi pèmèt enstitisyon verifye idantite touswit ak yon sèl API."
        q5:
          q: "Kisa mwen bezwen pou m verifye?"
          a_html: "Ou bezwen:<ul class='mt-2'><li><strong>CIN ou</strong> (yo aksepte yon paspò ki valab tou)</li><li><strong>Yon eskan figi an dirèk</strong> (selfie) ou fè pandan enskripsyon an</li><li><strong>Siyati ou</strong></li><li><strong>Yon prèv adrès</strong>: bòdwo sèvis, kontra lwaye, relve bank, resi transfè lajan, oswa bòdwo Digicel/Natcom</li></ul>Ou <strong>pa</strong> bezwen akt nesans.<br><br>Soumèt dosye a pran kèk minit. Apre sa, ekip nou an revize dokiman ou yo, epi n ap voye yon imel ba ou depi BonID ou apwouve."
        q6:
          q: "Èske BonID ranplase CIN mwen?"
          a_html: "Non. CIN ou rete dokiman idantite ofisyèl ou. BonID se idantite dijital ou ki pèmèt ou verifye tèt ou vit epi an sekirite ak telefòn ou oswa kòd QR."
        q7:
          q: "Kisa lèt yo nan BonID mwen vle di?"
          a_html: "Yon BonID tankou <strong>MO-1968-M-OU-P6790-H3Z</strong> òganize konsa:<ul class='mt-2'><li><strong>MO</strong> : inisyal prenon ak non ou</li><li><strong>1968</strong> : ane ou fèt</li><li><strong>M/F</strong> : sèks ou</li><li><strong>OU</strong> : depatman ou (kòd 2 lèt)</li><li><strong>P6790</strong> : tip dokiman ak yon nimewo referans ki soti nan kat idantite ou</li><li><strong>H3Z</strong> : kòd sekirite (checksum)</li></ul>"
        q8:
          q: "E si mwen pèdi bous mwen oswa dokiman yo?"
          a_html: "BonID ou rete an sekirite. Ou ka re-telechaje kòd QR ou nenpòt ki lè, mande re-issue, epi verifye tèt ou san ou pa pote dokiman fizik."
        q9:
          q: "Kilès ki ka verifye yon BonID?"
          a_html: "Sèlman patnè apwouve ki gen aksè an sekirite: bank, lopital, anbasad, ONG, konpayi telefòn, ak inite lapolis (PNH).<br><br><strong>Se ou ki kontwole:</strong><ul class='mt-2'><li>Yon patnè wè enfòmasyon ou sèlman apre ou apwouve sa sou ekran konsantman BonID la</li><li>Ou chwazi sa ou pataje, pa egzanp non ak foto ou men pa adrès ou</li><li>Ou ka retire aksè yon patnè nenpòt ki lè nan kont ou</li></ul>"
        q10:
          q: "E si mwen itilize fo dokiman?"
          a_html: "BonID fèt pou detekte fwod.<br><br>Chak dosye pase nan yon <strong>verifikasyon figi an dirèk</strong>, yon <strong>konparezon</strong> ant selfie ou ak foto ki sou kat idantite ou, ak yon <strong>revizyon manyèl</strong> ekip nou an fè sou dokiman ou yo.<br><br>Si yo detekte dokiman fo oswa modifye:<ul class='mt-2'><li>Yo pral rejte verifikasyon an</li><li>Yo pap bay BonID</li><li>Tantativ repete ka lakoz restriksyon sou kont lan</li></ul>BonID pwoteje sitwayen yo ak enstitisyon yo. Se dokiman reyèl e egzak ki obligatwa."
        q11:
          q: "Ki kote done mwen estoke, e kiyès ki ka wè yo?"
          a_html: "Done ou estoke an sekirite ak <strong>sèvè chifre</strong> ak sistèm ki kontwole aksè.<br><br>Pwen kle:<ul class='mt-2'><li>Dokiman ou chifre an repo ak pandan transmisyon</li><li>BonID <strong>pa</strong> vann done ou</li><li>Sèlman sistèm otorize ak patnè apwouve ka verifye BonID ou</li><li>Patnè yo pa resevwa dokiman brit sof si lalwa mande</li></ul>BonID suiv prensip minimizasyon done. Patnè yo sèlman wè sa ki nesesè."
        q12:
          q: "Kisa k rive si yon moun jwenn aksè ak kòd QR BonID mwen?"
          a_html: "Kòd QR BonID ou <strong>pa yon kat idantite estatik</strong>.<br><br>Menm si yon moun eskane li:<ul class='mt-2'><li>Yo pa ka wè tout dokiman ou</li><li>Sa pa pèmèt yo konekte sou kont ou ni apwouve yon pataj nan plas ou</li><li>Yo dwe yon patnè apwouve ak aksè an sekirite</li></ul>Lòt pwoteksyon yo gen ladan:<ul class='mt-2'><li>Log eskan yo</li><li>Rate-limiting ak deteksyon abi</li><li>Yon imel alèt chak fwa yon moun konekte sou kont ou ak yon nouvo aparèy, ak yon lyen pou dekonekte tout kote</li></ul>Si ou sispèk move itilizasyon, jenere yon nouvo kòd QR nan tablo bò ou, epi ansyen an p ap mache ankò."
        q13:
          q: "Kijan pou m enskri pou vote ak BonID?"
          a_html: "Louvri <strong>Eleksyon Mwen</strong> nan meni an, chwazi kijan w ap vote, epi peze <strong>Konfime Enskripsyon</strong>.<br><br>BonID itilize idantite ou ki deja verifye: ou pa bezwen voye okenn dokiman ankò.<br><br>Ou kapab enskri an pèsòn tou nan yon biwo BonID."
        q14:
          q: "Kiyès ki ka enskri?"
          a_html: "Pou enskri, ou dwe:<ul class='mt-2'><li>Gen <strong>18 an oswa plis</strong></li><li>Gen yon <strong>BonID verifye</strong></li><li>Gen yon <strong>pyès idantite verifye</strong> nan pwofil ou</li></ul>Si youn nan kondisyon yo manke, paj <strong>Eleksyon Mwen</strong> ap di w kisa pou w fè."
        q15:
          q: "Kisa nimewo elektè mwen ye?"
          a_html: "Se nimewo ki konfime enskripsyon ou, pa egzanp <strong>BVT-2026-K9F2-HQXR</strong>.<br><br>Li parèt sou <strong>Eleksyon Mwen</strong> ak sou resi ou. Ou ka kopye l an yon sèl klik. Kenbe l: w ap bezwen l jou vòt la."
        q16:
          q: "Kijan pou m konnen ki kote pou m vote?"
          a_html: "Seksyon <strong>Ki kote ak kilè pou vote</strong> sou paj <strong>Eleksyon Mwen</strong> montre sant vòt ou, nimewo biwo vòt ou (BV), lè yo louvri ak adrès la, ak yon lyen pou kat la.<br><br>Si li ekri <strong>Pa ko atribye</strong>, CEP ap ba ou yon biwo vòt byento."
        q17:
          q: "Kijan pou m pwouve mwen enskri?"
          a_html: "Telechaje oswa enprime <strong>resi enskripsyon</strong> ou sou <strong>Eleksyon Mwen</strong>.<br><br>Resi a gen yon <strong>kòd QR</strong>. Nenpòt moun ka eskane l ak yon telefòn pou konfime li otantik: yon ajan, fanmi ou oswa yon obsèvatè. Bouton <strong>Tcheke kounye a</strong> fè menm bagay la.<br><br>Konsèy: anrejistre resi a sou telefòn ou anvan jou vòt la, si rezo a ta pa mache."
        q18:
          q: "Èske m ka vote sou entènèt?"
          a_html: "Pa pou kounye a. Nan etap sa a, BonID sèvi pou <strong>enskri ou</strong> epi montre ou <strong>ki kote pou w vote</strong>.<br><br>Jou eleksyon an, ale nan biwo vòt ou ak pyès idantite ou."
        q19:
          q: "Sa k ap pase si dat eleksyon an chanje?"
          a_html: "Se <strong>CEP</strong> ki fikse dat yo. Si yo chanje, paj <strong>Eleksyon Mwen</strong> ap montre nouvo dat la depi yo anonse l.<br><br>Enskripsyon ou rete anrejistre: ou pa gen anyen pou w refè."
    
