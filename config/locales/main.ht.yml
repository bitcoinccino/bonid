      uses:
        banking:
          problem: "Pou louvri yon kont oswa retire yon transfè, yo mande kopi CIN, prèv adrès ak plizyè èdtan datant nan zòn ki danjere."
          solution: "Verifye idantite ou yon sèl fwa, lakay ou. Bank lan resevwa pwofil ou konfime, epi ou mwens bezwen deplase al nan ajans."
        mobile_wallet:
          problem: "Chak fwa ou voye lajan, retire oswa itilize yon pòtfèy mobil, yo mande papye ou ankò, yo refize foto ki flou, epi lajan an an reta lè ou pi bezwen l."
          solution: "Verifye yon sèl fwa. Yon eskanè konfime idantite ou, si ou dakò, pou voye ak retire lajan pi vit."
        healthcare:
          problem: "Dosye ou sou yon kanè papye. Si li pèdi, oswa si ou chanje lopital, fòk ou rekòmanse tout bagay."
          solution: "Lopital la idantifye ou nan yon sèl eskanè, menm si ou pa gen papye sou ou."
        law_enforcement:
          problem: "Mache ak papye orijinal ou, se riske yo vòlè yo. Kite yo lakay, se riske yo kenbe ou nan kontwòl. Epi fo papye yo ralanti travay lapolis."
          solution: "Yon sèl eskanè, epi ajan an konfime vre idantite ou sou plas. Ou pase kontwòl la vit e an sekirite, ak mwens risk pou pèdi papye ou."
        cep:
          problem: "Ensekirite fè li danjere pou al nan sant enskripsyon yo, epi lis elektoral yo plen moun ki enskri de fwa ak dosye ki manke."
          solution: "Enskri sou telefòn ou. Yon verifikasyon figi pwouve ou se yon moun reyèl, ki enskri yon sèl fwa, san ou pa pran wout."
        dgi:
          problem: "Pou yon NIF oswa yon demach taks, fòk ou pwouve kiyès ou ye nan chak gichè, ak kopi."
          solution: "DGI resevwa idantite verifye ou, si ou dakò."
        oni:
          problem: "Anpil moun pèdi CIN yo lè yo te kouri kite katye yo. Pou ranplase l, fòk ou fè plizyè vizit nan biwo ki debòde."
          solution: "Idantite verifye ou rete sou telefòn ou, menm si kat la pèdi."
        embassy:
          problem: "Viza, legalizasyon ak sèvis konsila mande vwayaj ki koute chè, papye legalize ak plizyè mwa datant."
          solution: "Pataje yon prèv siyen idantite ou sou entènèt, si ou dakò, pou mwens papye nan demach konsila ak viza ou."
        government:
          problem: "Pou yon paspò oswa yon dokiman ofisyèl, liy yo long epi gen raketè k ap fè moun peye randevou."
          solution: "Idantite ou deja verifye. Biwo a konfime l dirèkteman, san entèmedyè."
        telecommunications:
          problem: "Gen puce ki anrejistre sou fo non k ap sèvi pou eskwokri ak kidnaping."
          solution: "Chak liy mache ak yon moun ki verifye."
        insurance:
          problem: "Fwod sou idantite fè pri yo monte, epi verifye yon sinis ka pran plizyè semèn."
          solution: "Asirans lan konnen touswit ak kiyès li ap fè zafè."
        education:
          problem: "Fo diplòm ak dosye ki pèdi pandan deplasman yo bloke enskripsyon yo."
          solution: "Lekòl la konfime idantite elèv la nan yon sèl eskanè."
        retail:
          problem: "Livrezon ak vann a kredi riske lè ou pa ka verifye kliyan an."
          solution: "Machann nan verifye kliyan an nan yon eskanè, si kliyan an dakò."
        hospitality:
          problem: "Nan otèl, ou kite papye ou nan resepsyon oswa yo fotokopye l, san ou pa konnen kote l ale."
          solution: "Yo verifye ou san ou pa kite papye ou."
        real_estate:
          problem: "Gen tè yo vann bay plizyè moun, pa fo vandè."
          solution: "Ou konnen vandè a se vre moun li di li ye a."
        ngos:
          problem: "Pandan yon kriz, gen fanmi ki enskri de fwa, gen lòt yo bliye, epi èd la pèdi."
          solution: "Chak moun verifye yon sèl fwa ak figi li, epi èd la rive bay bon moun nan."
        legal:
          problem: "Fo prokirasyon ak moun k ap pran idantite lòt devan notè fè moun pèdi tè ak eritaj."
          solution: "Notè a konfime moun k ap siyen an se bon moun nan."
        cryptocurrency:
          problem: "Aplikasyon kripto ak transfè yo souvan bloke kont epi mande papye ou ankò, e yo souvan refize papye ayisyen. Debloke yon kont ka pran plizyè semèn."
          solution: "Pase kontwòl yo an kèk segonn, san ou pa voye foto papye ou ankò."
        default:
          problem: "Fo papye, kopi, liy: pwouve kiyès ou ye koute tan ak lajan."
          solution: "Yo verifye ou yon sèl fwa, epi ou pwouve l nan yon eskanè, si ou dakò."
        immigration:
          problem: "Pou yon paspò, ou souvan oblije peye yon raketè pou jwenn randevou, tann plizyè mwa nan foul moun, epi riske pèdi papye ou."
          solution: "Pa bezwen raketè ankò. Idantite ou verifye anvan ou rive, epi Imigrasyon konfime dosye ou dirèkteman."
