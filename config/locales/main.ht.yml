    faq:
      title: "Kesyon yo poze souvan"
      subtitle: "Tout sa ou bezwen konnen sou BonID, idantite dijital, sekirite, ak kijan li mache ann Ayiti."
      items:
        q1:
          q: "Kisa BonID ye?"
          a_html: "BonID se premye idantite dijital ki an sekirite ann Ayiti. Li verifye sitwayen ak rezidan yo atravè dosye, biyometrik figi, ak verifikasyon dokiman. Li pèmèt ou verifye tèt ou rapid nenpòt kote : bank, lopital, anbasad, pwogram èd, elatriye."
        q2:
          q: "Kisa BonTouris ID ye, e kijan li diferan ak iKAT?"
          a_html: "<strong>BonTouris ID</strong> se yon idantite dijital prive pou ede w pandan ou an Ayiti. Li pa yon dokiman vwayaj, li pa imigrasyon.<br><br>Li fèt pou itilize <strong>apre ou rive</strong>, pandan sejou ou, pou ede w verifye idantite w vit epi an sekirite ak <strong>polis, otèl, lopital, ONG, ak patnè otorize</strong>, san ou pa bezwen montre paspò w oswa papye yo chak fwa.<br><br><strong>Enpòtan:</strong><ul class=’mt-2’><li>BonTouris ID <strong>pa</strong> ranplase fòm ofisyèl <strong>iKAT</strong> (antre/sòti) Gouvènman Ayiti mande.</li><li>Tout vwayajè dwe ranpli iKAT anvan yo rive.</li><li>BonTouris ID se <strong>opsyonèl</strong> e li fèt pou itilize <strong>pandan sejou ou</strong>.</li></ul><br>Pandan iKAT modènize fòmalite fwontyè yo, BonTouris ID bay yon <strong>kòd QR</strong> patnè otorize yo ka eskane, enkli Polis Nasyonal d’Ayiti (PNH), pou verifye sejou legal ou, idantite debaz ou, ak kontak lokal ou an tan reyèl.<br><br>Sa fè entèraksyon chak jou yo pi an sekirite, pi rapid, e pi pratik pou vizitè yo."
        q3:
          q: "Kisa IDPol ye?"
          a_html: "IDPol se yon zouti verifikasyon modèn <strong>Verifyem</strong> devlope espesyalman pou Polis Nasyonal d’Ayiti (PNH).<br><br>Li pèmèt ajan PNH ki otorize yo verifye idantite an sekirite, tcheke estati BonID, epi konfime otantisite dokiman pandan operasyon ofisyèl yo.<br><br>IDPol <strong>pa</strong> yon ansyen sistèm, e li <strong>pa yon bazdone nasyonal idantite</strong>. Li travay ansanm ak BonID pou bay lapolis yon entèfas verifikasyon ki fyab an tan reyèl."
        q4:
          q: "Ki objektif BonID?"
          a_html: "BonID bay yon idantite dijital inifye epi an sekirite pou Ayiti. Li diminye fwod, akselere aksè a sèvis, pwoteje sitwayen yo, epi pèmèt enstitisyon verifye idantite touswit ak yon sèl API."
        q5:
          q: "Kisa mwen bezwen pou m verifye?"
          a_html: "Ou bezwen:<ul class='mt-2'><li>Yon CIN oswa paspò ki valab</li><li>Yon selfie oswa eskan figi</li><li>Yon dokiman sipò tankou akt nesans, NIF, lisans chofè, oswa bòdwo sèvis</li></ul>Verifikasyon an anjeneral pran mwens pase 2 minit."
        q6:
          q: "Èske BonID ranplase CIN mwen?"
          a_html: "Non. CIN ou rete dokiman idantite ofisyèl ou. BonID se idantite dijital ou ki pèmèt ou verifye tèt ou vit epi an sekirite ak telefòn ou oswa kòd QR."
        q7:
          q: "Kisa lèt yo nan BonID mwen vle di?"
          a_html: "Yon BonID tankou <strong>MO-1968-M-OU-P6790H3Z</strong> òganize konsa:<ul class='mt-2'><li><strong>MO</strong> : inisyal prenon ak non ou</li><li><strong>1968</strong> : ane ou fèt</li><li><strong>M/F</strong> : sèks ou</li><li><strong>OU</strong> : depatman ou (kòd 2 lèt)</li><li><strong>P/C</strong> : tip dokiman</li><li><strong>6790</strong> : 4 dènye chif CIN oswa paspò</li><li><strong>H3Z</strong> : kòd sekirite (checksum)</li></ul>"
        q8:
          q: "E si mwen pèdi bous mwen oswa dokiman yo?"
          a_html: "BonID ou rete an sekirite. Ou ka re-telechaje kòd QR ou nenpòt ki lè, mande re-issue, epi verifye tèt ou san ou pa pote dokiman fizik."
        q9:
          q: "Kilès ki ka verifye yon BonID?"
          a_html: "Sèlman patnè apwouve tankou bank, lopital, anbasad, ONG, konpayi telefòn, ak inite lapolis ki gen aksè API an sekirite."
        q10:
          q: "E si mwen itilize dokiman fo oswa dokiman AI?"
          a_html: "BonID fèt pou detekte fwod.<br><br>Tout dokiman yo analize ak yon konbinezon <strong>deteksyon fwod AI</strong>, <strong>matche dosye</strong>, ak <strong>revizyon manyèl lè sa nesesè</strong>.<br><br>Si yo detekte dokiman fo oswa modifye:<ul class='mt-2'><li>Yo pral rejte verifikasyon an</li><li>Yo pap bay BonID</li><li>Tantativ repete ka lakoz restriksyon sou kont lan</li></ul>BonID egziste pou pwoteje sitwayen yo ak enstitisyon yo."
        q11:
          q: "Ki kote done mwen estoke, e kiyès ki ka wè yo?"
          a_html: "Done ou estoke an sekirite ak <strong>sèvè chifre</strong> ak sistèm ki kontwole aksè.<br><br>Pwen kle:<ul class='mt-2'><li>Dokiman ou chifre an repo ak pandan transmisyon</li><li>BonID <strong>pa</strong> vann done ou</li><li>Sèlman sistèm otorize ak patnè apwouve ka verifye BonID ou</li><li>Patnè yo pa resevwa dokiman brit sof si lalwa mande</li></ul>BonID suiv prensip minimizasyon done. Patnè yo sèlman wè sa ki nesesè."
        q12:
          q: "Kisa k rive si yon moun jwenn aksè ak kòd QR BonID mwen?"
          a_html: "Kòd QR BonID ou <strong>pa yon kat idantite estatik</strong>.<br><br>Menm si yon moun eskane li:<ul class='mt-2'><li>Yo pa ka wè tout dokiman ou</li><li>Yo pa ka pran plas ou</li><li>Yo dwe yon patnè apwouve ak aksè an sekirite</li></ul><br>Lòt pwoteksyon yo gen ladan:<ul class='mt-2'><li>Log eskan yo</li><li>Rate-limiting ak deteksyon abi</li><li>Revoke / re-issue QR imedyat si sa nesesè</li></ul>Si ou sispèk move itilizasyon, ou ka mande yon nouvo BonID epi ansyen QR la vin invalid pou tout tan."
        q13:
          q: "Kijan pou m vote ak BonID?"
          a_html: "Pou vote atravè BonID:<ol class='mt-2'><li>Ale sou paj <strong>Vote nan Eleksyon</strong> nan meni an</li><li>Sistèm lan tcheke si ou gen BonID verifye, yon nimewo CIN, epi ou poko vote</li><li>Klike <strong>Kòmanse Vote</strong> — w ap fè yon verifikasyon biyometrik (figi) pou pwouve se ou menm</li><li>Ranpli bilten vòt ou pou chak pozisyon (prezidan, senatè, depite, elatriye)</li><li>Konfime chwa ou — vòt ou chifre epi voye nan rejis piblik la</li><li>Ou resevwa yon <strong>Ballot Hash</strong> (nimewo resi) sou ekran konfimasyon an</li></ol>Pwosesis la pran anba 3 minit."
        q14:
          q: "Kisa yon \"Ballot Hash\" ye?"
          a_html: "Yon <strong>Ballot Hash</strong> se yon nimewo espesyal (tankou yon resi dijital) ki pwouve <strong>vòt ou te anrejistre epi li pral konte</strong> nan rezilta final yo.<br><br><strong>Enpòtan:</strong><ul class='mt-2'><li>Li <strong>pa</strong> montre ki kandida ou chwazi</li><li>Li sèlman pwouve vòt ou egziste nan rejis piblik la</li><li>Se sèl prèv vòt ou — sere li byen</li></ul>Kenbe li nan yon sekrè kote: screenshot, nòt, oswa voye li sou WhatsApp pou tèt ou."
        q15:
          q: "Kote m jwenn resi vòt mwen (Ballot Hash)?"
          a_html: "Apre ou fin vote, ou ap wè yon ekran ki di <strong>\"Vòt ou anrejistre!\"</strong>. Sou ekran sa a:<ul class='mt-2'><li>Ou jwenn Ballot Hash la nan yon bwat ble ki vizib</li><li>Genyen yon <strong>kòd QR</strong> ki gen menm enfòmasyon an</li><li>Genyen yon gwo bouton <strong>\"Kopye Ballot Hash la\"</strong> — peze li pou mete nimewo a nan mémwa telefòn ou</li><li>Genyen yon bouton <strong>WhatsApp</strong> pou voye li bay tèt ou oswa yon moun ou fè konfyans</li></ul><br><strong>Konsèy:</strong> Pran yon screenshot epitou kopye li — konsa ou pa ka pèdi li."
        q16:
          q: "Kijan pou m verifye ke vòt mwen konte?"
          a_html: "Gen 2 fason pou verifye:<br><br><strong>1. Sèvi ak kòd QR la (pi fasil):</strong><br>Eskane kòd QR ki te parèt sou ekran resi ou. Sa ap ouvri paj verifikasyon an ak hash la deja ranpli — senp peze \"Verifye\".<br><br><strong>2. Ak Ballot Hash la:</strong><ol class='mt-2'><li>Ale sou <strong>Verifye Vòt Mwen</strong> nan meni an</li><li>Kole Ballot Hash ou nan chan an</li><li>Peze <strong>Verifye</strong></li></ol>Si vòt ou la, w ap wè yon ekran vèt ki konfime. Si li pa jwenn, tcheke byen ke ou kopye hash la kòrèkteman."
        q17:
          q: "Èske moun ka wè ki kandida mwen chwazi?"
          a_html: "<strong>Non.</strong> Vòt ou totalman sekrè.<br><br>Men kijan sa mache:<ul class='mt-2'><li>Chwa ou <strong>chifre</strong> (encrypted) anvan li voye</li><li>Sèvè a <strong>pa janm konnen</strong> ki moun ou vote pou li</li><li>Se sèlman yon <strong>kle sekrè Komisyon Elektoral</strong> ki ka deschifre chwa yo, apre eleksyon an fini, pou konte vòt yo</li><li>Ballot Hash ou pwouve vòt ou egziste, men li <strong>pa</strong> montre chwa ou</li></ul>Sistèm lan swiv menm pwensip sekirite sèvi ak Estonia ak Swis nan eleksyon yo."
        q18:
          q: "Èske m ka vote plizyè fwa?"
          a_html: "<strong>Non.</strong> Chak sitwayen ka vote sèlman yon fwa pou chak eleksyon.<br><br>Pwoteksyon yo:<ul class='mt-2'><li>Yon <strong>nullifier</strong> inik kreye pou chak CIN — sa anpeche menm moun vote de fwa</li><li>Sistèm lan verifye anvan chak vòt</li><li>Si ou eseye vote ankò, w ap resevwa menm resi a ak ansyen vòt ou</li></ul>Si ou gen pwoblèm (pa egzanp, ou panse ou pa te fini vote), kontakte sipò imedyatman."
        q19:
          q: "Kilè rezilta eleksyon yo sòti?"
          a_html: "Rezilta ofisyèl yo pral sòti apre Komisyon Elektoral (CEP) fè <strong>sètifikasyon</strong>. Pwosesis la gen ladan:<ul class='mt-2'><li>Konte tout vòt yo (chifre epi deschifre ak kle sekrè CEP la)</li><li>Verifye entegrite rejis piblik la</li><li>Pibliye rezilta ak yon badj \"Sètifye\"</li></ul>Antretan, w ap wè yon badj \"Ap konte\" sou paj <strong>Rezilta</strong> a. Pou elesyon nasyonal Ayiti 2026, dat sètifikasyon an pral anonse pa CEP la."
    
