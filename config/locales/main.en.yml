    faq:
      title: "Frequently Asked Questions"
      subtitle: "Everything you need to know about BonID, digital identity, security, and how it works in Haiti."
      items:
        q1:
          q: "What is BonID?"
          a_html: "BonID is Haiti’s first secure digital identity. It verifies citizens and residents using your CIN, a live face scan matched to your ID photo, and a review of your documents by our team.<br><br>Once verified, you can prove who you are instantly at:<ul class='mt-2'><li>Banks and financial institutions</li><li>Hospitals and clinics</li><li>Embassies and consulates</li><li>Aid programs and NGOs</li><li>Telecom providers and more</li></ul>Your information is shared with an organization only when you approve it."
        q2:
          q: "What is BonTouris ID and how is it different from iKAT?"
          a_html: "<strong>BonTouris ID</strong> is your private digital companion for your stay in Haiti. It is not a travel document or immigration tool.<br><br>It is designed to be used <strong>after arrival</strong>, during your stay, to help you verify your identity quickly and safely with <strong>police, hotels, hospitals, NGOs, and authorized partners</strong>, without repeatedly presenting your passport or paper documents.<br><br><strong>Important:</strong><ul class='mt-2'><li>BonTouris ID does <strong>not</strong> replace the official <strong>iKAT arrival/departure form</strong> required by the Government of Haiti.</li><li>All travelers must still complete iKAT before arriving in Haiti.</li><li>BonTouris ID is <strong>optional</strong> and intended for use <strong>during your stay</strong>.</li></ul><br><strong>What it does:</strong><ul class='mt-2'><li>Provides a <strong>scannable QR code</strong> for identity verification</li><li>Lets authorized partners (including PNH) verify your legal stay in real time</li><li>Confirms basic identity and local contact information</li><li>Makes everyday interactions safer, faster, and more convenient</li></ul>"
        q3:
          q: "What is IDPol?"
          a_html: "IDPol is a modern verification tool built by <strong>Verifyem</strong> specifically for the Haitian National Police (PNH).<br><br>It allows authorized PNH officers to:<ul class='mt-2'><li>Securely verify citizen identities</li><li>Check BonID status in real time</li><li>Confirm document authenticity during official operations</li></ul><strong>Important:</strong><ul class='mt-2'><li>IDPol is <strong>not</strong> a historical or legacy system</li><li>It is <strong>not</strong> a national identity database</li><li>It works alongside BonID as a trusted law enforcement verification interface</li></ul>"
        q4:
          q: "What is the purpose of BonID?"
          a_html: "BonID provides a secure, unified digital identity for Haiti.<br><br>Key benefits:<ul class='mt-2'><li>Reduces identity fraud and document forgery</li><li>Speeds up access to services across all sectors</li><li>Protects citizens with encrypted, tamper-proof verification</li><li>Allows institutions to verify identity instantly with one API</li></ul>"
        q5:
          q: "What do I need to get verified?"
          a_html: "You need:<ul class='mt-2'><li><strong>Your CIN</strong> (a valid passport is also accepted)</li><li><strong>A live face scan</strong> (selfie) taken during sign-up</li><li><strong>Your signature</strong></li><li><strong>Proof of address</strong>: a utility bill, lease, bank statement, money-transfer receipt, or Digicel/Natcom phone bill</li></ul>You do <strong>not</strong> need a birth certificate.<br><br>Submitting takes a few minutes. Our team then reviews your documents, and we email you as soon as your BonID is approved."
        q6:
          q: "Does BonID replace my CIN?"
          a_html: "No. Your CIN remains your official government-issued identity.<br><br>BonID is your <strong>digital identity layer</strong> that works alongside your CIN:<ul class='mt-2'><li>Verify yourself quickly using your phone or QR code</li><li>No need to carry physical documents everywhere</li><li>Your CIN data is securely linked, not replaced</li></ul>"
        q7:
          q: "What do the letters in my BonID mean?"
          a_html: "A BonID such as <strong>MO-1968-M-OU-P6790-H3Z</strong> is structured as:<ul class='mt-2'><li><strong>MO</strong>: initials of your first and last name</li><li><strong>1968</strong>: your birth year</li><li><strong>M/F</strong>: your sex</li><li><strong>OU</strong>: your department (2-letter code)</li><li><strong>P6790</strong>: your ID type and a reference number from your ID</li><li><strong>H3Z</strong>: tamper-proof checksum</li></ul>"
        q8:
          q: "What if I lost my wallet or documents?"
          a_html: "Your BonID stays safe even if your physical documents are lost.<br><br>Here is what you can do:<ul class='mt-2'><li>Re-download your QR code anytime from your dashboard</li><li>Request a BonID reissue if needed</li><li>Verify yourself digitally without carrying physical documents</li></ul>"
        q9:
          q: "Who can verify a BonID?"
          a_html: "Only approved partners with secure access can verify a BonID. These include:<ul class='mt-2'><li>Banks and financial institutions</li><li>Hospitals and healthcare providers</li><li>Embassies and consulates</li><li>NGOs and aid organizations</li><li>Telecom providers</li><li>Police units (PNH)</li></ul><strong>You stay in control:</strong><ul class='mt-2'><li>A partner sees your information only after you approve it on the BonID consent screen</li><li>You choose what to share, for example your name and photo but not your address</li><li>You can withdraw a partner’s access at any time from your account</li></ul>"
        q10:
          q: "What if I use fake documents?"
          a_html: "BonID is designed to detect fraud.<br><br>Every submission goes through a <strong>live face check</strong>, a <strong>comparison</strong> between your selfie and the photo on your ID, and a <strong>manual review</strong> of your documents by our team.<br><br>If fake or altered documents are detected:<ul class='mt-2'><li>Your verification will be rejected</li><li>Your BonID will not be issued</li><li>Repeated attempts may lead to account restrictions</li></ul>BonID protects citizens and institutions. Real, accurate documents are required."
        q11:
          q: "Where is my data stored and who can access it?"
          a_html: "Your data is securely stored using <strong>encrypted servers and access-controlled systems</strong>.<br><br><strong>Key points:</strong><ul class='mt-2'><li>Encrypted at rest and in transit</li><li>BonID does <strong>not</strong> sell your data</li><li>Only authorized systems and approved partners can verify your BonID</li><li>Partners never receive raw documents unless legally required</li></ul><strong>Data minimization:</strong><ul class='mt-2'><li>Partners only see what is necessary to confirm your identity</li><li>No excess data is shared, ever</li></ul>"
        q12:
          q: "What happens if someone gains access to my BonID QR code?"
          a_html: "Your BonID QR code is <strong>not a static identity card</strong>.<br><br><strong>Even if someone scans your QR code:</strong><ul class='mt-2'><li>They cannot see your full documents</li><li>It does not let them sign in to your account or approve sharing on your behalf</li><li>They must be an approved partner with secure access</li></ul><strong>Built-in protections:</strong><ul class='mt-2'><li>Scan logging and monitoring</li><li>Rate-limiting and abuse detection</li><li>An email alert whenever your account is signed in to from a new device, with a link to sign out everywhere</li></ul>If you suspect misuse, generate a new QR code from your dashboard and your previous one stops working."
        q13:
          q: "How do I register to vote with BonID?"
          a_html: "Open <strong>My Election</strong> in the menu, choose how you will vote, then tap <strong>Confirm Registration</strong>.<br><br>BonID uses your already verified identity, so you don’t need to send any documents again.<br><br>You can also register in person at a BonID office."
        q14:
          q: "Who can register?"
          a_html: "To register, you need:<ul class='mt-2'><li>To be <strong>18 or older</strong></li><li>A <strong>verified BonID</strong></li><li>A <strong>verified ID document</strong> on your profile</li></ul>If something is missing, the <strong>My Election</strong> page tells you what to do."
        q15:
          q: "What is my voter number?"
          a_html: "It’s the number that confirms your registration, for example <strong>BVT-2026-K9F2-HQXR</strong>.<br><br>It shows on <strong>My Election</strong> and on your receipt. You can copy it in one tap. Keep it: you’ll need it on election day."
        q16:
          q: "How do I know where to vote?"
          a_html: "The <strong>Where &amp; when to vote</strong> section of <strong>My Election</strong> shows your voting center, your station number (BV), opening hours and the address, with a link to the map.<br><br>If it says <strong>Not assigned yet</strong>, the CEP will assign you a polling station soon."
        q17:
          q: "How do I prove I’m registered?"
          a_html: "Download or print your <strong>registration receipt</strong> from <strong>My Election</strong>.<br><br>The receipt has a <strong>QR code</strong>. Anyone can scan it with a phone to confirm it’s genuine: an agent, your family or an observer. The <strong>Check now</strong> button does the same.<br><br>Tip: save the receipt on your phone before election day, in case the network is down."
        q18:
          q: "Can I vote online?"
          a_html: "Not for now. At this stage, BonID is for <strong>registering</strong> and showing you <strong>where to vote</strong>.<br><br>On election day, go to your polling station with your ID."
        q19:
          q: "What happens if the election dates change?"
          a_html: "Dates are set by the <strong>CEP</strong>. If they change, the <strong>My Election</strong> page shows the new date as soon as it’s announced.<br><br>Your registration stays on record, so there’s nothing to redo."

