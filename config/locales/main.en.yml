    faq:
      title: "Frequently Asked Questions"
      subtitle: "Everything you need to know about BonID, digital identity, security, and how it works in Haiti."
      items:
        q1:
          q: "What is BonID?"
          a_html: "BonID is Haiti’s first secure digital identity. It verifies citizens and residents using government records, facial biometrics, and document checks.<br><br>You can use BonID to verify yourself instantly at:<ul class=’mt-2’><li>Banks and financial institutions</li><li>Hospitals and clinics</li><li>Embassies and consulates</li><li>Aid programs and NGOs</li><li>Telecom providers and more</li></ul>"
        q2:
          q: "What is BonTouris ID and how is it different from iKAT?"
          a_html: "<strong>BonTouris ID</strong> is your private digital companion for your stay in Haiti. It is not a travel document or immigration tool.<br><br>It is designed to be used <strong>after arrival</strong>, during your stay, to help you verify your identity quickly and safely with <strong>police, hotels, hospitals, NGOs, and authorized partners</strong>, without repeatedly presenting your passport or paper documents.<br><br><strong>Important:</strong><ul class='mt-2'><li>BonTouris ID does <strong>not</strong> replace the official <strong>iKAT arrival/departure form</strong> required by the Government of Haiti.</li><li>All travelers must still complete iKAT before arriving in Haiti.</li><li>BonTouris ID is <strong>optional</strong> and intended for use <strong>during your stay</strong>.</li></ul><br><strong>What it does:</strong><ul class='mt-2'><li>Provides a <strong>scannable QR code</strong> for identity verification</li><li>Lets authorized partners (including PNH) verify your legal stay in real time</li><li>Confirms basic identity and local contact information</li><li>Makes everyday interactions safer, faster, and more convenient</li></ul>"
        q3:
          q: "What is IDPol?"
          a_html: "IDPol is a modern verification tool built by <strong>Verifyem</strong> specifically for the Haitian National Police (PNH).<br><br>It allows authorized PNH officers to:<ul class=’mt-2’><li>Securely verify citizen identities</li><li>Check BonID status in real time</li><li>Confirm document authenticity during official operations</li></ul><strong>Important:</strong><ul class=’mt-2’><li>IDPol is <strong>not</strong> a historical or legacy system</li><li>It is <strong>not</strong> a national identity database</li><li>It works alongside BonID as a trusted law enforcement verification interface</li></ul>"
        q4:
          q: "What is the purpose of BonID?"
          a_html: "BonID provides a secure, unified digital identity for Haiti.<br><br>Key benefits:<ul class='mt-2'><li>Reduces identity fraud and document forgery</li><li>Speeds up access to services across all sectors</li><li>Protects citizens with encrypted, tamper-proof verification</li><li>Allows institutions to verify identity instantly with one API</li></ul>"
        q5:
          q: "What do I need to get verified?"
          a_html: "You need:<ul class='mt-2'><li>A valid CIN or Passport</li><li>A selfie or face scan</li><li>One supporting document such as a birth certificate, NIF, driver’s license, or utility bill</li></ul>Verification usually takes less than two minutes."
        q6:
          q: "Does BonID replace my CIN?"
          a_html: "No. Your CIN remains your official government-issued identity.<br><br>BonID is your <strong>digital identity layer</strong> that works alongside your CIN:<ul class='mt-2'><li>Verify yourself quickly using your phone or QR code</li><li>No need to carry physical documents everywhere</li><li>Your CIN data is securely linked, not replaced</li></ul>"
        q7:
          q: "What do the letters in my BonID mean?"
          a_html: "A BonID such as <strong>MO-1968-M-OU-P6790-H3Z</strong> is structured as:<ul class='mt-2'><li><strong>MO</strong>: initials of your first and last name</li><li><strong>1968</strong>: your birth year</li><li><strong>M/F</strong>: your sex</li><li><strong>OU</strong>: your department (2-letter code)</li><li><strong>P6790</strong>: ID type + last 4 digits of your CIN or Passport</li><li><strong>H3Z</strong>: tamper-proof checksum</li></ul>"
        q8:
          q: "What if I lost my wallet or documents?"
          a_html: "Your BonID stays safe even if your physical documents are lost.<br><br>Here is what you can do:<ul class='mt-2'><li>Re-download your QR code anytime from your dashboard</li><li>Request a BonID reissue if needed</li><li>Verify yourself digitally without carrying physical documents</li></ul>"
        q9:
          q: "Who can verify a BonID?"
          a_html: "Only approved partners with secure API access can verify a BonID. These include:<ul class='mt-2'><li>Banks and financial institutions</li><li>Hospitals and healthcare providers</li><li>Embassies and consulates</li><li>NGOs and aid organizations</li><li>Telecom providers</li><li>Police units (PNH)</li></ul>No unauthorized person or organization can access your BonID data."
        q10:
          q: "What if I used AI-generated or fake documents?"
          a_html: "BonID is designed to detect fraud.<br><br><strong>Every document is analyzed using:</strong><ul class='mt-2'><li><strong>AI fraud detection</strong> for forgery, tampering, and AI-generated fakes</li><li><strong>Government record matching</strong> to confirm authenticity</li><li><strong>Manual review</strong> when additional verification is needed</li></ul><strong>If fake or altered documents are detected:</strong><ul class='mt-2'><li>Your verification will be rejected</li><li>Your BonID will not be issued</li><li>Repeated attempts may result in account restrictions</li></ul>Submitting real, accurate documents is required to keep the system trusted and secure."
        q11:
          q: "Where is my data stored and who can access it?"
          a_html: "Your data is securely stored using <strong>encrypted servers and access-controlled systems</strong>.<br><br><strong>Key points:</strong><ul class='mt-2'><li>Encrypted at rest and in transit</li><li>BonID does <strong>not</strong> sell your data</li><li>Only authorized systems and approved partners can verify your BonID</li><li>Partners never receive raw documents unless legally required</li></ul><strong>Data minimization:</strong><ul class='mt-2'><li>Partners only see what is necessary to confirm your identity</li><li>No excess data is shared, ever</li></ul>"
        q12:
          q: "What happens if someone gains access to my BonID QR code?"
          a_html: "Your BonID QR code is <strong>not a static identity card</strong>.<br><br><strong>Even if someone scans your QR code:</strong><ul class='mt-2'><li>They cannot see your full documents</li><li>They cannot impersonate you</li><li>They must be an approved partner with secure access</li></ul><strong>Built-in protections:</strong><ul class='mt-2'><li>Scan logging and monitoring</li><li>Rate-limiting and abuse detection</li><li>Instant QR revocation and reissue if needed</li></ul>If you suspect misuse, request a new BonID and your previous QR code is permanently invalidated."

