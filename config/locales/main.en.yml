      uses:
        banking:
          problem: "In Haiti, opening an account means crossing dangerous areas and coming back for a missing copy. Abroad it’s worse: banks and investment platforms often reject Haitian IDs, and Haitians stay shut out of savings, credit and investing."
          solution: "You verify your identity once, from your phone. Partner banks and platforms, in Haiti and abroad, receive an already-confirmed file they can check, so you can open an account, borrow or invest wherever BonID is accepted."
        mobile_wallet:
          problem: "According to the PNH, more than 18,000 suspicious transfers of 5,000 to 15,000 gourdes moved through NatCash and MonCash in 72 hours, sent from numbers linked to gangs to people all over the country. Behind these accounts, often a fake name."
          solution: "The wallet verifies who sends and who receives the money. An account in a fake name can no longer take a ransom without leaving the trace of a real person."
        healthcare:
          problem: "Your medical record lives in a paper booklet. If you flee your neighborhood or change hospitals, it doesn’t follow you: tests redone, allergies forgotten, time lost in an emergency."
          solution: "The hospital confirms your identity with one scan and knows who you are, even far from home. You get treated faster, without starting from zero."
        law_enforcement:
          problem: "Carrying your originals means risking theft. Leaving them at home means risking being held at a checkpoint because you can’t prove who you are."
          solution: "You show your BonID and the officer confirms your identity on the spot. Your papers stay safe at home, and the check takes seconds."
        cep:
          problem: "To get on the voter roll, many people have to cross gang-controlled areas. Those who can’t make the trip simply lose their right to vote."
          solution: "You register from your phone, without going on the road. A face check confirms you are a real person, registered only once."
        dgi:
          problem: "For a NIF or any tax paperwork, every counter asks for your documents again. Forget one copy and you lose a day. And from abroad, you can’t pay tax on your house or business in Haiti online: you have to fly home or pay a middleman."
          solution: "The DGI receives your already-verified identity. Your paperwork moves without going back to the counter, and the DGI can accept filings and payments from the diaspora online, wherever they live."
        oni:
          problem: "Thousands of families lost their CIN fleeing their homes. Without the card, you can’t pick up a transfer, open an account or prove who you are."
          solution: "Your verified identity stays on your phone, even if the card is lost or stolen. You can keep proving who you are while you wait for a new CIN."
        embassy:
          problem: "Visas and consular services mean costly trips, legalized papers and months of waiting. One rejected document and everything starts over."
          solution: "You share signed proof of your identity online. Fewer papers to legalize, fewer trips, and a file the embassy can check right away."
        government:
          problem: "For an official document, raketè sell the appointments and lines start before dawn. Those who don’t pay wait for weeks."
          solution: "Your identity is already verified before you reach the office. The office confirms it directly: no middleman to pay, less time in line."
        telecommunications:
          problem: "Gangs call families with SIM cards bought under fake names to demand ransoms. The numbers change every day and lead to no one."
          solution: "The carrier verifies who each SIM belongs to before activating it. A SIM in a fake name no longer works, and gangs lose their easiest tool."
        insurance:
          problem: "Identity fraud pushes premiums up for everyone, and checking a claim can take weeks, right when you need the money most."
          solution: "The insurer knows right away who they are dealing with. Real policyholders get paid faster, and fraud costs everyone less."
        education:
          problem: "Displaced students lose their report cards and diplomas when they flee. Without papers, enrolling in a new school is blocked."
          solution: "The school confirms the student’s identity with one scan, even without the original papers. The child goes back to class instead of waiting."
        retail:
          problem: "Selling on credit or delivering to an unknown customer means risking never getting paid. Many merchants would rather say no."
          solution: "The merchant verifies the customer with one scan before delivering or giving credit. More sales, fewer unpaid bills."
        hospitality:
          problem: "At a hotel, you leave your ID at the front desk or let it be photocopied, without knowing who will see it or where the copy ends up."
          solution: "You are verified with one scan, without leaving your papers or a photocopy behind."
        real_estate:
          problem: "The same land is sometimes sold to several buyers by fake sellers. A lifetime of savings disappears with one signature."
          solution: "You know the seller is really who they say they are before you pay. Less risk of losing your money in a fake sale."
        ngos:
          problem: "In a crisis, some families get registered twice and others never. Aid doesn’t reach the people who need it most."
          solution: "Each person is verified once, by their face. Aid goes to the right family, and nobody is counted twice or left out."
        legal:
          problem: "Fake powers of attorney and signatures in someone else’s name cost people land and inheritances. It’s often discovered too late, in court."
          solution: "The notary checks that the signer is really who they claim to be before anything is signed. Your land and your inheritance stay yours."
        cryptocurrency:
          problem: "Crypto, transfer and investment apps often freeze Haitian accounts or reject our IDs. Without an account, you can’t invest abroad or receive money from the diaspora without going through middlemen who take their cut."
          solution: "A verified identity the app can confirm in seconds. Fewer frozen accounts, and access to platforms that accept BonID to save, invest and receive money directly."
        default:
          problem: "Fake papers, copies, lines: proving who you are in Haiti costs time, money and sometimes your safety."
          solution: "You are verified once. Then you prove who you are with one scan, wherever BonID is accepted."
        immigration:
          problem: "An immigration file often means paying a raketè, waiting for months and handing over your originals without knowing if they’ll come back."
          solution: "Your identity arrives already verified. Immigration confirms your file directly, with no middleman, and you keep your originals with you."
