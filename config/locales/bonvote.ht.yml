    security_title: "Sekirite: Teknoloji ki pa ka Hake"
    security_intro: "BonVote itilize menm kalite kriptografi ke bank ak gouvènman itilize. Men kijan chak kouch pwoteje vòt ou."
    pedersen_title: "Pedersen Commitments"
    pedersen_desc: "Kache chwa ou pandan li angaje l. Menm administratè sistèm nan pa ka wè vòt ou jiskaske konte a fini. Se tankou mete vòt ou nan yon kòf ki pa ka ouvri jiskaske tout moun fin vote."
    schnorr_title: "Schnorr ZKP (Prèv Zero-Konesans)"
    schnorr_desc: "Pwouve ou gen dwa vote epi bilten ou valab (pa egzanp, ou pa t vote pou 10 kandida) san revele ki moun ou te vote. Matematik pwouve l, pa imen."
    aes_title: "AES-256-GCM (Chifraj Otantifye)"
    aes_desc: "Garanti done bilten k ap deplase depi telefòn ou pou rive nan sèvè nan Port-au-Prince pa ka entèsepte oswa modifye. Menm nivo sekirite ak bank entènasyonal."
    biometric_title: "Verifikasyon Biyometrik Doub"
    biometric_desc: "Anprent dijital + nimewo CIN (Kat Idantifikasyon Nasyonal). Sitwayen ak dyaspora itilize BonID pou verifikasyon. De kouch sekirite anpeche tout fwod."
    fraud_title: "Prevansyon Fwod"
    fraud_desc: "Elimine ireglarite 'lis karans' (vòt reprezantan pati), vant pas vòt, ak bourraj d'urnes (ranpli bwat bilten). Sistèm dijital la rann tout sa enposib."

    how_title: "Vwayaj Elektè a"
    step1_title: "Enskripsyon ak ONI"
    step1_desc: "Itilize Kat Idantifikasyon Nasyonal (CIN) ou ki deja gen biyometrik (eskan je, anprent dijital). BonID bati sou enfrastrikti ak teknoloji ONI (Office National d'Identification) ki deja egziste, li pa ranplase l."
    step2_title: "Verifye Idantite ak BonID"
    step2_desc: "Konekte epi verifye idantite ou atravè BonID ak deteksyon vivacite (liveness), yon selfie an dirèk, ak konparezon dokiman ak CIN oswa Paspò ou. BonID verifye figi ou ak dokiman ou ak bazdone biyometrik ONI ki deja egziste pou konfime ou se yon vrè sitwayen. Sitwayen lokal ak dyaspora itilize menm sistèm nan."
    step3_title: "Vote an Sekirite"
    step3_desc: "Chwazi kandida ou. Vòt ou chifre touswit ak Pedersen Commitment. Pèsonn pa ka wè kisa ou te vote, menm sèvè a."
    step4_title: "Resevwa Resi (Merkle Path)"
    step4_desc: "Resevwa yon nimewo resi inik. Sa se chemen Merkle ou, ki pèmèt ou pwouve vòt ou te vrèman enkli nan konte final la. Se 'Bwat Bilten Dijital' la."
    step5_title: "Verifye nan Rejis Piblik"
    step5_desc: "Kole nimewo resi ou nan rechèch la adwat pou konfime vòt ou anrejistre. Chak vòt se yon fèy nan pyebwa Merkle a."
    step6_title: "Rezilta Enstantane"
    step6_desc: "Vòt yo ale nan sèvè nasyonal via entènèt/intranèt. Rezilta preliminè an kèk minit olye de semèn konte manyèl."

    what_title: "Kisa BonVote ye?"
    mission_title: "Misyon"
    mission_desc: "Yon platfòm vòt desantralize ak transparan pou Ayiti. Ale lwen bilten papye ki fasil pou 'bourrage d'urnes' (ranpli bwat bilten) epi ale nan yon demokrasi ki ka verifye matematik."
    platform_title: "Platfòm Mobil"
    platform_desc: "Fèt pou Android ak iOS pou akomode pifò telefòn ann Ayiti. Optimize pou rezo 3G/4G ak siyati ZKP ki ase piti pou voye sou yon siynal fèb."
    diaspora_title: "Pou Dyaspora ak Sitwayen Lokal"
    diaspora_desc: "Dè milyon Ayisyen k ap viv aletranje pa gen opsyon vòt adistans kounye a. BonVote bay yo yon vwa nan demokrasi peyi yo."
    ledger_title: "Rejis Verifye"
    ledger_desc: "Pa yon senp bazdone. Se yon rejis verifye (verifiable ledger), estanda ki pi wo pou entegrite elektoral. Nenpòt sitwayen oswa obsèvatè ka verifye matematik eleksyon an."

    advantages_title: "Avantaj BonVote"
    transparency_title: "Transparans Total"
    transparency_desc: "Gras a Merkle Tree, nenpòt sitwayen oswa obsèvatè entènasyonal ka verifye matematik eleksyon an san vyole sekrè vòt. OEA, UN, medya, tout moun ka odite."
    inclusion_title: "Enklizyon Dyaspora"
    inclusion_desc: "Pèmèt milyon Ayisyen k ap viv aletranje patisipe an sekirite nan eleksyon peyi yo."
    savings_title: "Ekonomize $18 Milyon"
    savings_desc: "Elimine enpresyon bilten ak transpòte yo nan tout teren difisil peyi a, plis sant konte manyèl."
    participation_title: "Ogmante Patisipasyon"
    participation_desc: "Patisipasyon nan 2016 te sèlman 19%. Aksè pi fasil ka ogmante l siyifikativman gras a vòt mobil."
    aid_title: "Redui Depandans Èd Etranje"
    aid_desc: "Pi ba pri eleksyon redui depandans Ayiti sou finansman entènasyonal pou pwosesis demokratik li."

    performance_title: "Pèfòmans ak Echèl"
    performance_intro: "500K vòt nan 12 èdtan = 11.5 vòt/segonn mwayèn. Sistèm nan ka jere 1,000+ pa segonn san pwoblèm."
