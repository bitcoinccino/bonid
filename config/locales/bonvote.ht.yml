    # Results page - How It Works
    results_how_title: "Kijan Sa Fonksyone"
    results_how_sub: "Depi jou eleksyon an jiska pwoklame eli a — chak etap verifye, chifre, ak transparan."
    results_step1_title: "1. Enskripsyon ak ONI"
    results_step1_desc: "Sitwayen enskri nan Lis Elektoral ONI a. BonID verifye idantite w ak byometrik (rekonesans figi + vivacite) pou asire se ou menm ki ou ye. Chak elektè resevwa yon BonID inik."
    results_step2_title: "2. Jou Eleksyon — Vote"
    results_step2_desc_html: "Sou telefòn ou oswa nan yon biwo vòt (kiosk), ou verifye idantite w ak liveness check. Ou chwazi kandida w epi soumèt vòt ou. Vòt la chifre ak <strong style='color:#EDB95E;'>AES-256-GCM</strong> + <strong style='color:#EDB95E;'>Pedersen Commitment</strong> — menm BonID pa ka wè ki moun ou vote pou li."
    results_step3_title: "3. Resi Kriptografik"
    results_step3_desc_html: "Ou resevwa yon <strong style='color:#10B981;'>Merkle Path</strong> — prèv matematik ki montre vòt ou anrejistre nan sistèm nan san revele ki moun ou vote pou li. Ou ka verifye li nenpòt lè sou <a href='/election/verify' style='color: #2563EB; text-decoration: none; font-weight: 600;'>rejis piblik la</a>."
    results_step4_title: "4. Bwat Vòt la Fèmen"
    results_step4_desc: "Lè vòt fini, bwat la sele ak kriptografi militè. Pèsonn pa ka wè rezilta yo — ni BonID, ni gouvènman, ni okenn teknisyen. Rezilta yo rete chifre jiskaske seremoni dechifre a."
    results_step5_title: "5. Seremoni Multi-Sig (3 nan 5)"
    results_step5_desc_html: "Pou ouvri bwat vòt la, <strong style='color:#fff;'>3 nan 5</strong> ofisyèl endepandan (obsèvatè nasyonal, entènasyonal, CEP, sosyete sivil, teknoloji) dwe chak verifye idantite yo ak BonID epi antre kle prive yo. Okenn moun pa ka ouvri rezilta a pou kont li."
    results_step6_title: "6. Rezilta An Dirèk"
    results_step6_desc: "Lè 3 siyati fin verifye, rezilta yo dechifre epi parèt an dirèk sou paj sa a. Rezilta pwovizwa montre an tan reyèl — chak vòt ki konte parèt enstantanem. Tout moun kapab wè menm rezilta yo an menm tan — pa gen sezon espesyal, pa gen koulwa sekrè."
    results_step7_title: "7. Sètifikasyon & Eli Pwoklame"
    results_step7_desc_html: "Lè peryòd kontestasyon an fini, CEP sètifye rezilta final yo. Kandida ki genyen an pwoklame ofisyèlman. Hash kriptografik final la anrejistre pou toutan — prèv ki pa ka chanje, pa ka efase, pa ka falsifye. Nenpòt moun ka verifye otantisite rezilta yo ak <a href='/election/verify' style='color: #2563EB; text-decoration: none; font-weight: 600;'>odit piblik BonVote la <i class='ri-external-link-line' style='font-size: 0.6rem;'></i></a>."
    results_summary_html: "<strong style='color: #fff;'>Tout etap yo oditab, verifye, ak transparan.</strong><br>Pa gen bwat vòt ki pèdi. Pa gen bilten ki disparèt. Pa gen rezilta ki fabrike.<br>Chak vòt konte — epi ou ka pwouve sa."
    results_view: "Wè Rezilta Ofisyèl Yo"

