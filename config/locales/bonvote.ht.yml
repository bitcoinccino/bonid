    verifiable_title: "BonVote: rejis verifye (verifiable ledger)"
    verifiable_desc: "Estanda ki pi wo pou entegrite elektoral. Chak vòt gen yon prèv kriptografik. Nenpòt moun ka odite matematik la."
    estonia_note: "Modèl entènasyonal tankou i-Voting Estonia montre sistèm sa posib. Ayiti gen defi inik nan enfrastrikti, men BonVote optimize pou rezo mobil lokal yo."

    faq_title: "Kesyon yo Poze Souvan"
    faq1_q: "Èske vòt mwen sekrè?"
    faq1_a: "Wi, totalman. Pedersen Commitment kache chwa ou. Menm sèvè BonVote pa ka wè kisa ou te vote. Lè konte a fini, sèlman total la revele, pa vòt endividyèl yo."
    faq2_q: "Èske yon moun ka vote de fwa?"
    faq2_a: "Enposib. Sistèm 'nullifier' ZKP la detekte doub vòt nan 1.74ms. Chak sitwayen gen yon sèl nullifier inik ki pa ka itilize de fwa. Matematik la anpeche l, pa imen."
    faq3_q: "E si mwen pèdi telefòn mwen?"
    faq3_a: "Vòt ou deja sele nan rejis la, li pa sou telefòn ou. Ou ka verifye li ak nimewo resi ou sou nenpòt aparèy. Si ou poko te vote, ou ka revoke aksè ak BonID epi re-verifye sou yon nouvo aparèy."
    faq4_q: "Èske BonVote se yon solisyon majik?"
    faq4_a: "Non. Ekspè yo sigjere yon tranzisyon konplè ka pran jiska 10 ane. Sa mande konfyans piblik, edikasyon, ak enfrastrikti. Men chak eleksyon ak BonVote se yon pa pi pre."
    faq5_q: "E pèt travay?"
    faq5_a: "Vòt manyèl bay anviwon 50,000 travay tanporè. BonVote ranplase yo ak mwens wòl men ki pi kalifye, pi byen peye: teknik IT, sipò sitwayen, odidtè kriptografik."
    faq6_q: "Kiyès ki ka verifye rezilta yo?"
    faq6_a: "Tout moun. Rejis piblik la ouvè pou obsèvatè entènasyonal (OEA, UN), medya, pati politik, ak tout sitwayen. Matematik la piblik, pa gen sekrè nan konte a."

